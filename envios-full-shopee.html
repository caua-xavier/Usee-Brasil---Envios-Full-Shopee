/* ---------- File handling for invoices ---------- */
async function handleInvoiceFiles(shipmentId, files){
  // Expand any .zip files into their inner xml/pdf entries first
  const flat = [];
  for(const file of files){
    const ext = file.name.toLowerCase().split('.').pop();
    if(ext === 'zip'){
      try{
        const buf = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(buf);
        const entries = Object.keys(zip.files).filter(n =>
          !n.startsWith('__MACOSX') && !zip.files[n].dir && /\.(xml|pdf)$/i.test(n)
        );
        if(!entries.length){ toast(`${file.name}: nenhum XML/PDF dentro do .zip`, 'warn'); continue; }
        toast(`${file.name}: ${entries.length} arquivos encontrados`, 'ok');
        for(const n of entries){
          const innerExt = n.toLowerCase().split('.').pop();
          if(innerExt === 'xml'){
            const text = await zip.files[n].async('string');
            flat.push({ kind:'xml', name: n.split('/').pop(), text });
          }else{
            const u = await zip.files[n].async('arraybuffer');
            flat.push({ kind:'pdf', name: n.split('/').pop(), buf: u });
          }
        }
      }catch(err){
        console.error(err);
        toast(`Erro lendo ${file.name}: ${err.message}`, 'err');
      }
    }else if(ext === 'xml'){
      flat.push({ kind:'xml', name: file.name, text: await file.text() });
    }else if(ext === 'pdf'){
      flat.push({ kind:'pdf', name: file.name, buf: await file.arrayBuffer() });
    }else{
      toast(`Formato não suportado: ${file.name}`, 'err');
    }
  }
  if(!flat.length){ render(); return; }

  toast(`Processando ${flat.length} nota${flat.length===1?'':'s'}...`, '');
  let okCount = 0, errCount = 0;
  for(const f of flat){
    try{
      let nf;
      if(f.kind === 'xml'){
        nf = parseXmlNFe(f.text);
        nf.xmlText = f.text;
      }else{
        nf = await parsePdfNFe(f.buf);
        try{
          const bytes = new Uint8Array(f.buf);
          let bin = '';
          for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
          nf.pdfBase64 = btoa(bin);
        }catch(e){ console.warn('Não consegui armazenar PDF inline:', e); }
      }
      nf.filename = f.name;
      addNoteToShipment(shipmentId, nf);
      okCount++;
    }catch(err){
      console.error(err);
      errCount++;
      toast(`Erro em ${f.name}: ${err.message}`, 'err');
    }
  }
  if(okCount) toast(`${okCount} nota${okCount===1?'':'s'} adicionada${okCount===1?'':'s'}${errCount?` (${errCount} com erro)`:''}`, okCount && !errCount ? 'ok' : 'warn');
  render();
}

      ean: it.ean, qty: it.qty || 0, unit: it.unit,
      cProd: it.cProd, xProd: it.xProd,
      productId, sku, varianteIdentificador, variationName, productName, productImage,
      matched: !!cat,
      manualMatch: !!(cat && cat.__manual)
    };
    // Fill missing catalog fields from FBS supplements (account-wide)
    if(cat && acct && fbsSupplements[acct]){
      const suppKey = (flat.productId||'') + '||' + (flat.varianteIdentificador||'');
      const supp = fbsSupplements[acct][suppKey];
      if(supp){
        if(!flat.variationName && supp.variationName) flat.variationName = supp.variationName;
        if(!flat.sku && supp.sku) flat.sku = supp.sku;
        if(!flat.ean && supp.ean) flat.ean = supp.ean;
        flat._suppFilled = true;
      }
    }
    // Per-shipment overrides (variationOverrides) take final priority
    const flatFinal = (typeof applyVariationOverrides === 'function') ? applyVariationOverrides(shipment, flat) : flat;
    items.push(flatFinal);
    // Inclui EAN/cProd na chave para garantir que variações com mesmo (productId, varId, sku) — mas EAN diferente — não colapsem
    const uniqExtra = normEan(flatFinal.ean||it.ean||'') || (it.cProd||'');
    const key = cat
      ? `${productId}||${varianteIdentificador||''}||${sku||''}||${uniqExtra}`
      : `__unmatched__||${uniqExtra}`;
    if(!byKey.has(key)) byKey.set(key, { ...flatFinal, qty:0 });
    byKey.get(key).qty += flatFinal.qty;
  };
  for(const nf of (shipment.notes||[])){
    totalVolumes += nf.volumes || 0;
    for(const it of nf.items){ processItem('nf', nf.id, nf.nNF, nf.source, it); }
  }
  for(const ho of (shipment.hubOrders||[])){
    for(const it of ho.items){ processItem('hub', ho.id, ho.pedidoNum, 'hub', it); }
  }
  return { items, totals: Array.from(byKey.values()), totalVolumes };
}

function toggleExportMenu(wrap){

function exportShipmentXlsx(shipmentId){
  const s = getShipment(shipmentId);
  if(!s){ toast('Envio não encontrado','err'); return; }
  if(!s.account){ toast('Selecione a conta Shopee do envio antes de exportar','err'); return; }
  if(!getCatalogFor(s.account)){ toast(`Carregue o catálogo da conta ${SHOPEE_ACCOUNTS[s.account].label}`,'err'); return; }
  const agg = aggregateShipment(s);
  // Rows: A ID do Produto, B SKU (parent), C Variante Identificador (variation SKU or integ), D Quantidade
  const data = [];
  data.push(['ID do Produto','SKU','Variante Identificador','Quantidade']);
  for(const t of agg.totals){
    if(!t.matched) continue; // unmatched items don't go to the model
    const overrideKey = `${t.productId}||${t.varianteIdentificador||''}||${t.sku||''}`;
    const qty = (s.customQty && s.customQty[overrideKey] != null) ? s.customQty[overrideKey] : t.qty;
    if(!qty) continue;
    data.push([
      t.productId || '',
      t.sku || '',
      t.varianteIdentificador || '',
      Number(qty)
    ]);
  }
  if(data.length === 1){ toast('Nenhum item para exportar (sem itens casados com o catálogo)','warn'); return; }
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:16},{wch:24},{wch:24},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Aprovação');
  const acctTag = s.account ? '_' + SHOPEE_ACCOUNTS[s.account].label.replace(/\s+/g,'') : '';
  const fname = `Envio${acctTag}_${(s.code||'sem-codigo').replace(/[^a-z0-9_-]/gi,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast('Planilha gerada: ' + fname, 'ok');
}
/* ---------- Conferência de ASN Shopee (importar planilha e cruzar com Total Consolidado) ---------- */
let _asnCheck = null; // { shipmentId, filename, importedAt, items:[{productName, variationName, vendorSku, shopSkuId, warehouseSkuId, qty}] }

function parseAsnXlsx(arrayBuffer, filename){
  const wb = XLSX.read(new Uint8Array(arrayBuffer), { type:'array' });
  let bestSheet = wb.SheetNames[0], bestRows = 0, bestJson = null;
  for(const sn of wb.SheetNames){
    const j = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval:'', raw:false });
    if(j.length > bestRows){ bestRows = j.length; bestSheet = sn; bestJson = j; }
  }
  if(!bestJson || !bestJson.length) throw new Error('Planilha vazia');
  const headers = Object.keys(bestJson[0]);
  const findCol = (...needles) => {
    const low = headers.map(h => String(h||'').toLowerCase().replace(/[*_·.\s()-]+/g,''));
    for(const needle of needles){
      const n = String(needle).toLowerCase().replace(/[*_·.\s()-]+/g,'');
      const i = low.findIndex(h => h.includes(n));
      if(i >= 0) return headers[i];
    }
    return null;
  };
  const colVendor = findCol('iddoskudovendedor','skudovendedor','vendorsku','iddosku');
  const colShop = findCol('shopskuid','skudaloja');
  const colWarehouse = findCol('warehouseskuid','skudoarmazem','warehouse');
  const colQty = findCol('quantidadesolicitada','quantidade','qty','quantidadeinbound');
  const colProd = findCol('nomedoproduto','produto');
  const colVar = findCol('nomedavariacao','variacao','variação');
  if(!colQty) throw new Error('Coluna de Quantidade não encontrada na ASN');
  if(!colVendor && !colShop && !colWarehouse) throw new Error('Nenhuma coluna de identificador (ID do SKU do vendedor / Shop SKU ID / Warehouse SKU ID) encontrada');
  const items = [];
  for(const row of bestJson){
    const qty = parseFloat(String(row[colQty]||'').replace(/\./g,'').replace(',','.')) || 0;
    if(!qty) continue;
    items.push({
      productName: colProd ? String(row[colProd]||'').trim() : '',
      variationName: colVar ? String(row[colVar]||'').trim() : '',
      vendorSku: colVendor ? String(row[colVendor]||'').trim() : '',
      shopSkuId: colShop ? String(row[colShop]||'').trim() : '',
      warehouseSkuId: colWarehouse ? String(row[colWarehouse]||'').trim() : '',
      qty
    });
  }
  return { filename, items };
}

async function parseAsnPdf(arrayBuffer, filename){
  if(typeof pdfjsLib === 'undefined') throw new Error('pdf.js não carregado');
  const SKU_LEN = 12; // SKU do vendedor da Shopee tem exatamente 12 caracteres hex
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  // Coleta tokens em ordem natural + guarda posição (x, y, página) de cada um
  const tokens = [];
  const pos = []; // {p, x, y} paralelo a tokens
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    for(const t of tc.items){
      const str = (t.str||'').trim();
      if(!str) continue;
      const parts = str.split(/\s+/).filter(Boolean);
      for(let pi=0; pi<parts.length; pi++){
        tokens.push(parts[pi]);
        pos.push({ p, x: t.transform[4] + pi*6, y: t.transform[5] });
      }
    }
  }

  // Localiza números de linha (1, 2, 3, ...) com hex-com-letras nos próximos 6 tokens.
  // Mais tolerante: aceita qualquer configuração onde o SKU vendedor aparece nas proximidades.
  const rowStarts = [];
  let expectedN = 1;
  for(let i=0;i<tokens.length;i++){
    if(tokens[i] !== String(expectedN)) continue;
    // Procura hex-com-letras nos próximos 6 tokens (não apenas i+1)
    let hasHexNearby = false;
    for(let k = i+1; k < Math.min(tokens.length, i+7); k++){
      const t = tokens[k];
      if(/^[0-9A-F]+$/i.test(t) && /[A-F]/i.test(t) && t.length >= 2){
        hasHexNearby = true;
        break;
      }
      // Se bater em outro número de linha pequeno (próximo expectedN+1), para
      if(t === String(expectedN+1)) break;
    }
    if(hasHexNearby){
      rowStarts.push(i);
      expectedN++;
    }
  }
  if(!rowStarts.length) throw new Error('Não encontrei a sequência de linhas (1, 2, 3...) no PDF');

  const yTol = 5; // tolerância para "mesmo Y" (mesma linha visual)
  const items = [];
  for(let k=0;k<rowStarts.length;k++){
    const from = rowStarts[k];
    const to = (k+1 < rowStarts.length) ? rowStarts[k+1] : tokens.length;
    const anchor = pos[from]; // posição do número da linha

    // Vendor SKU — Fase 1: concatena hex consecutivos (ordem natural do pdf.js).
    // Em alguns PDFs o pdf.js intercala colunas (col2 topo, col3, col4, ..., col2 continuação),
    // então pode ficar faltando parte do SKU. Nesse caso a Fase 2 completa buscando o fragmento.
    let vendorSku = '';
    let j = from + 1;
    while(j < to && vendorSku.length < SKU_LEN){
      const t = tokens[j];
      if(!/^[0-9A-F]+$/i.test(t)) break;
      if(vendorSku.length + t.length > SKU_LEN) break;
      vendorSku += t;
      j++;
    }
    // Fase 2: se o SKU não completou 12 chars, busca forward por um fragmento curto
    // que complete o tamanho exato. Prioridade por score:
    //  +2 se o token está em Y ABAIXO do número da linha (= coluna 2 que quebrou linha)
    //  +1 se tem letra hex (A-F) — distingue de qty/EAN que são só dígitos
    if(vendorSku.length > 0 && vendorSku.length < SKU_LEN){
      const needed = SKU_LEN - vendorSku.length;
      let best = null;
      for(let k = from + 1; k < to; k++){
        const t = tokens[k];
        if(t.length !== needed) continue;
        if(!/^[0-9A-F]+$/i.test(t)) continue;
        const isBelowAnchor = pos[k].p === anchor.p && pos[k].y < anchor.y - 2;
        const hasLetter = /[A-F]/i.test(t);
        const score = (isBelowAnchor ? 2 : 0) + (hasLetter ? 1 : 0);
        if(!best || score > best.score){
          best = { tok: t, score };
        }
      }
      if(best){
        vendorSku += best.tok;
      }
    }
    vendorSku = vendorSku.toUpperCase();

    // Qnt Aprovada: pega o item puramente numérico (1-4 dígitos) com o MAIOR X
    // na MESMA linha Y do número da linha (ou seja, no top da linha do PDF).
    // Isso elimina tokens de rodapé/cabeçalho que estão em outros Ys.
    let qty = 0;
    let qtyX = -Infinity;
    for(let j = from + 1; j < to; j++){
      if(pos[j].p !== anchor.p) break; // sai se mudou de página
      if(Math.abs(pos[j].y - anchor.y) > yTol) continue; // só na linha do anchor
      if(!/^\d{1,4}$/.test(tokens[j])) continue;
      if(pos[j].x > qtyX){
        qtyX = pos[j].x;
        qty = parseInt(tokens[j], 10);
      }
    }

    // Variação (ex: "Branco,35")
    const chunkText = tokens.slice(from, to).join(' ');
    const varMatch = chunkText.match(/\b([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ/-]*(?:\s[A-Za-zÀ-ÿ/-]+)*)\s*,\s*(\d{2})\b/);
    const variationName = varMatch ? `${varMatch[1]},${varMatch[2]}` : '';

    if(vendorSku.length >= 10 && vendorSku.length <= 14 && qty > 0){
      items.push({
        productName: '',
        variationName,
        vendorSku,
        shopSkuId: '',
        warehouseSkuId: '',
        qty
      });
    }
  }

  if(!items.length) throw new Error('Não consegui extrair itens do PDF — reexporte como .xlsx');
  return { filename, items };
}

async function handleAsnFile(shipmentId, files){
  const file = files && files[0]; if(!file) return;
  const ext = file.name.toLowerCase().split('.').pop();
  if(!['xlsx','xls','pdf'].includes(ext)){ toast('Formato não suportado: use .xlsx ou .pdf','err'); return; }
  try{
    const buf = await file.arrayBuffer();
    const parsed = ext === 'pdf' ? await parseAsnPdf(buf, file.name) : parseAsnXlsx(buf, file.name);
    _asnCheck = {
      shipmentId,
      filename: file.name,
      importedAt: new Date().toISOString(),
      items: parsed.items
    };
    toast(`ASN importada: ${parsed.items.length} linhas`,'ok');
    openAsnConferenceModal(shipmentId);
  }catch(err){
    console.error(err);
    toast(`Erro ao ler ASN: ${err.message}`,'err');
  }
}

function clearAsnCheck(shipmentId){
  _asnCheck = null;
  _asnFilter = 'all';
  openAsnConferenceModal(shipmentId);
}
let _asnFilter = 'all'; // 'all' | 'ok' | 'diff' | 'miss' | 'extra'
function setAsnFilter(v, shipmentId){ _asnFilter = v; openAsnConferenceModal(shipmentId); }

function openAsnConferenceModal(shipmentId){
  const s = getShipment(shipmentId);
  if(!s){ toast('Envio não encontrado','err'); return; }
  const wrap = document.getElementById('modalWrap');
  const hasAsn = _asnCheck && _asnCheck.shipmentId === shipmentId && _asnCheck.items && _asnCheck.items.length;
  const agg = aggregateShipment(s);
  const matched = agg.totals.filter(t => t.matched);
  // Mapa do Total Consolidado por SKU — usa primeiros 10 chars como chave (mais tolerante a
  // extrações parciais do PDF). SKU Shopee tem 12 chars hex pseudo-aleatórios, 10 já é único.
  const _normSku = v => String(v||'').trim().toUpperCase().replace(/[\s\-_]+/g,'');
  const _skuKey = v => { const n = _normSku(v); return n.length >= 10 ? n.slice(0, 10) : n; };
  const consolidatedBySku = new Map();
  for(const t of matched){
    const overrideKey = `${t.productId}||${t.varianteIdentificador||''}||${t.sku||''}`;
    const qty = (s.customQty && s.customQty[overrideKey] != null) ? Number(s.customQty[overrideKey]) : Number(t.qty)||0;
    const skuKey = _skuKey(t.sku);
    if(!skuKey) continue;
    if(!consolidatedBySku.has(skuKey)){
      consolidatedBySku.set(skuKey, { productId:t.productId, productName:t.productName, variationName:t.variationName, sku:t.sku, varianteIdentificador:t.varianteIdentificador, ean:t.ean, qty:0 });
    }
    consolidatedBySku.get(skuKey).qty += qty;
  }

  let bodyHtml;
  if(!hasAsn){
    bodyHtml = `
      <div class="dropzone" onclick="document.getElementById('asnFile').click()" style="border-color:rgba(30,212,224,.35)">
        <div style="font-size:36px">📥</div>
        <div style="margin-top:6px"><strong style="color:var(--accent)">Clique ou arraste</strong> a ASN da Shopee (.xlsx ou .pdf)</div>
        <div class="small" style="margin-top:6px;color:var(--muted)">.xlsx: com as colunas ID do SKU do vendedor, Shop SKU ID, Warehouse SKU ID e Quantidade.<br/>.pdf: a Solicitação de Envio ao Armazém (ASN) impressa — o sistema extrai SKU do vendedor + Qnt Aprovada automaticamente.</div>
      </div>
      <input type="file" id="asnFile" accept=".xlsx,.xls,.pdf" style="display:none" onchange="handleAsnFile('${s.id}', this.files); this.value=''" />
      <div style="margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px">
        <div class="small" style="color:var(--muted);line-height:1.5"><strong style="color:var(--txt-strong)">Como funciona:</strong> O sistema cruza cada linha da ASN com o <strong>Total Consolidado</strong> deste envio pelo <strong>ID do SKU do vendedor (Model ID)</strong>. Mostra onde a quantidade bate, onde diverge, e o que ficou de fora de cada lado.</div>
      </div>
    `;
  } else {
    // Agrega ASN por SKU do vendedor usando primeiros 10 chars (chave tolerante a extrações parciais)
    const asnBySku = new Map();
    for(const it of _asnCheck.items){
      const skuKey = _skuKey(it.vendorSku);
      if(!skuKey) continue;
      if(!asnBySku.has(skuKey)) asnBySku.set(skuKey, { ...it, qty:0 });
      asnBySku.get(skuKey).qty += Number(it.qty)||0;
    }
    // Cria lista unificada por chave SKU
    const allKeys = new Set([...consolidatedBySku.keys(), ...asnBySku.keys()]);
    const rows = [];
    let okN=0, diffN=0, missInAsnN=0, extraInAsnN=0;
    let totConsol=0, totAsn=0;
    for(const key of allKeys){
      const c = consolidatedBySku.get(key);
      const a = asnBySku.get(key);
      const cQty = c ? c.qty : 0;
      const aQty = a ? a.qty : 0;
      totConsol += cQty; totAsn += aQty;
      let status;
      if(c && a){
        if(cQty === aQty){ status='ok'; okN++; }
        else { status='diff'; diffN++; }
      } else if(c && !a){ status='miss'; missInAsnN++; }
      else if(!c && a){ status='extra'; extraInAsnN++; }
      rows.push({
        skuDisplay: (c?.sku || a?.vendorSku || key),
        productId: c?.productId || '',
        productName: c?.productName || a?.productName || '',
        variationName: c?.variationName || a?.variationName || '',
        cQty, aQty,
        diff: aQty - cQty,
        status
      });
    }
    // Ordena: divergências primeiro, depois faltantes, extras, por último OK
    const order = { diff:0, miss:1, extra:2, ok:3 };
    rows.sort((a,b) => (order[a.status]-order[b.status]) || Math.abs(b.diff)-Math.abs(a.diff));
    const totalDiff = totAsn - totConsol;
    bodyHtml = `
      <div style="background:${totalDiff===0 && diffN===0 && missInAsnN===0 && extraInAsnN===0 ? 'rgba(46,204,113,.08)' : 'linear-gradient(135deg,rgba(245,158,11,.1),rgba(239,68,68,.08))'};border:1px solid ${totalDiff===0 && diffN===0 && missInAsnN===0 && extraInAsnN===0 ? 'rgba(46,204,113,.4)' : 'rgba(245,158,11,.4)'};border-radius:12px;padding:14px 16px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div>
            <div class="small" style="color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:3px">${totalDiff===0 && diffN===0 && missInAsnN===0 && extraInAsnN===0 ? '✅ Resultado da conferência' : '⚠️ Divergências encontradas'}</div>
            <div style="font-size:14px;font-weight:700">
              <span style="color:#2ecc71">✓ ${okN} ok</span> ·
              <span style="color:#f59e0b">⚠ ${diffN} divergente${diffN===1?'':'s'}</span> ·
              <span style="color:#ef4444">✗ ${missInAsnN} fora da ASN</span> ·
              <span style="color:#a855f7">+ ${extraInAsnN} extras na ASN</span>
            </div>
          </div>
          <div style="text-align:right">
            <div class="small" style="color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Total Consolidado × ASN</div>
            <div style="font-size:15px;font-weight:800">${totConsol} un · ${totAsn} un · <span style="color:${totalDiff===0?'var(--txt)':(totalDiff>0?'#a855f7':'#ef4444')}">${totalDiff>0?'+':''}${totalDiff}</span></div>
          </div>
        </div>
      </div>
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">
        <div class="small" style="color:var(--muted)"><strong style="color:var(--txt)">${escapeHtml(_asnCheck.filename)}</strong> · ${_asnCheck.items.length} linhas · importada ${fmtDate(_asnCheck.importedAt)}</div>
        <div class="row" style="gap:6px">
          <button class="btn ghost sm" onclick="document.getElementById('_asnDebugBox').style.display=document.getElementById('_asnDebugBox').style.display==='none'?'block':'none'" style="padding:5px 10px;font-size:11px">🔍 Debug</button>
          <button class="btn ghost sm" onclick="document.getElementById('asnFile2').click()" style="padding:5px 10px;font-size:11px">↻ Trocar ASN</button>
          <button class="btn danger sm" onclick="clearAsnCheck('${s.id}')" style="padding:5px 10px;font-size:11px">× Limpar</button>
          <input type="file" id="asnFile2" accept=".xlsx,.xls,.pdf" style="display:none" onchange="handleAsnFile('${s.id}', this.files); this.value=''" />
        </div>
      </div>
      <div id="_asnDebugBox" style="display:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;max-height:220px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5">
        <div style="font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-size:10.5px;margin-bottom:6px">Itens extraídos da ASN (${_asnCheck.items.length}) — SKU · qty</div>
        ${_asnCheck.items.map((it,i) => `<div style="padding:1px 0"><span style="color:var(--muted)">${String(i+1).padStart(3,' ')}.</span> <strong style="color:var(--accent)">${escapeHtml(it.vendorSku||'(sem SKU)')}</strong> · <span style="color:${(Number(it.qty)||0)>0?'var(--txt)':'#ef4444'}">${it.qty||0}</span>${it.variationName?` <span style="color:var(--muted)">· ${escapeHtml(it.variationName)}</span>`:''}</div>`).join('')}
      </div>
      <div class="row" style="gap:6px;margin-bottom:10px;flex-wrap:wrap;font-size:12px;font-weight:700;align-items:center">

          ].join('');
        })()}

            ${rows.filter(r => _asnFilter === 'all' || r.status === _asnFilter).map(r => {
              let statusLabel, color, bg;
              if(r.status==='ok'){ statusLabel='✓ OK'; color='#2ecc71'; bg=''; }
              else if(r.status==='diff'){ statusLabel='⚠ Divergente'; color='#f59e0b'; bg='background:rgba(245,158,11,.07)'; }
              else if(r.status==='miss'){ statusLabel='✗ Fora da ASN'; color='#ef4444'; bg='background:rgba(239,68,68,.08)'; }
              else { statusLabel='+ Extra na ASN'; color='#a855f7'; bg='background:rgba(168,85,247,.07)'; }
              return `<tr style="${bg}">
                <td><div class="small mono" style="color:var(--muted);font-size:10.5px">${escapeHtml(r.productId||'—')}</div>${escapeHtml(r.productName||'—')}</td>

                <td class="num" style="font-weight:700">${r.aQty}</td>

                <td style="color:${color};font-weight:700;font-size:11.5px;white-space:nowrap">${statusLabel}</td>

/* ---------- FBS lookup + Shopee Inbound export ---------- */
function indexFbsByVariante(account){
  const f = getFbsFor(account);
  if(!f) return null;
  const h = f.headers || [];
  const findCol = (...names) => {
    for(const n of names){
      const i = h.findIndex(x => String(x||'').toLowerCase().trim() === n.toLowerCase().trim());
      if(i >= 0) return h[i];
    }
    return null;
  };
  const colVend = findCol('ID do SKU do vendedor','Seller SKU') || h[3];
  const colLoja = findCol('ID do SKU da Loja','Shop SKU ID','Shop SKU') || h[4];
  const colArmz = findCol('ID do SKU do Armazém','ID do SKU do Armazem','Warehouse SKU ID','Warehouse SKU') || h[5];
  const colNome = findCol('Nome do Produto','Product Name') || h[0];
  const colVar = findCol('Variação (ões)','Variação(ões)','Variacao (oes)','Variations','Nome da variação','Variation Name') || h[1];
  if(!colVend) return null;
  // Index by ALL possible keys: vendor hex, full Shop SKU ID, full Warehouse SKU ID,
  // and the numeric suffix of those (the actual variation_id from the catalog).
  const idx = new Map();
  const set = (k, row) => {
    const nk = normKey(k);
    if(nk && !idx.has(nk)) idx.set(nk, row);
  };
  for(const row of f.rows){
    set(row[colVend], row);
    const loja = String(row[colLoja]||'').trim();
    if(loja){
      set(loja, row);
      const p = loja.split('_');
      if(p.length >= 2) set(p[p.length-1], row); // variation_id (numeric)
    }
    const armz = String(row[colArmz]||'').trim();
    if(armz){
      set(armz, row);
      const p = armz.split('_');
      if(p.length >= 2) set(p[p.length-1], row);
    }
  }
  // Manual entries cadastrados pelo usuário (sobrescrevem se a chave já existir)
  for(const m of (manualEntries[account] || [])){
    if(!m.varianteIdentificador && !m.shopSkuId) continue;
    const fakeRow = {
      __manual: true,
      [colVend]: m.varianteIdentificador || '',
      [colLoja]: m.shopSkuId || '',
      [colArmz]: m.warehouseSkuId || '',
      [colNome]: m.productName || '',
      [colVar]: m.variationName || ''
    };
    if(m.varianteIdentificador) set(m.varianteIdentificador, fakeRow);
    if(m.shopSkuId){
      set(m.shopSkuId, fakeRow);
      const p = m.shopSkuId.split('_');
      if(p.length >= 2) set(p[p.length-1], fakeRow);
    }
    if(m.warehouseSkuId){
      set(m.warehouseSkuId, fakeRow);
      const p = m.warehouseSkuId.split('_');
      if(p.length >= 2) set(p[p.length-1], fakeRow);
    }
  }
  return { idx, colVend, colLoja, colArmz, colNome, colVar };
}

function normKey(v){ return String(v==null?'':v).trim().toUpperCase().replace(/\s+/g,''); }

function exportShopeeInboundXlsx(shipmentId){
  const s = getShipment(shipmentId);
  if(!s){ toast('Envio não encontrado','err'); return; }
  if(!s.account){ toast('Selecione a conta Shopee do envio antes de exportar','err'); return; }
  if(!getCatalogFor(s.account)){ toast(`Carregue o catálogo da conta ${SHOPEE_ACCOUNTS[s.account].label}`,'err'); return; }
  if(!getFbsFor(s.account)){ toast(`Carregue a planilha FBS da conta ${SHOPEE_ACCOUNTS[s.account].label}`,'err'); return; }
  if(!colMap.varianteIdentificador){
    toast('Catálogo sem coluna "Variante Identificador" mapeada. Abra Catálogo → Aplicar padrão Shopee.','err'); return;
  }
  const fix = indexFbsByVariante(s.account);
  if(!fix){ toast('Não consegui identificar as colunas do FBS (ID do SKU do vendedor).','err'); return; }

  const agg = aggregateShipment(s);
  const matchedItems = agg.totals.filter(t => t.matched);

  const headers = [
    'Nome do Produto',
    'Nome da variação',
    'ID do SKU do vendedor',
    'Shop SKU ID',
    'Warehouse SKU ID',
    '* Quantidade Solicitada inbound (pcs)'
  ];
  const data = [headers];
  const missing = [];
  let withVariante = 0, fbsHits = 0, qtyZero = 0;
  const exampleVariantes = [];
  for(const t of matchedItems){
    const overrideKey = `${t.productId}||${t.varianteIdentificador||''}||${t.sku||''}`;
    const qty = (s.customQty && s.customQty[overrideKey] != null) ? s.customQty[overrideKey] : t.qty;
    if(!qty){ qtyZero++; continue; }
    const rawVend = t.varianteIdentificador;
    const vendKey = String(rawVend||'').trim();
    if(vendKey){
      withVariante++;
      if(exampleVariantes.length < 5) exampleVariantes.push(vendKey);
    }
    const fbsRow = vendKey ? fix.idx.get(normKey(vendKey)) : null;
    if(!fbsRow){
      missing.push({ ean: t.ean, productName: t.productName, variante: vendKey, qty });
      continue;
    }
    fbsHits++;
    data.push([
      String(fbsRow[fix.colNome]||''),
      String(fbsRow[fix.colVar]||''),
      String(fbsRow[fix.colVend]||''),
      String(fbsRow[fix.colLoja]||''),
      String(fbsRow[fix.colArmz]||''),
      Number(qty)
    ]);
  }

  if(data.length === 1){
    const fbsKeys = Array.from(fix.idx.keys());
    const sampleFbs = fbsKeys.slice(0, 10);
    const diag = {
      itensCasadosNoCatalogo: matchedItems.length,
      itensComVarianteIdentificador: withVariante,
      itensComQtdZero: qtyZero,
      exemplosVariantesDoEnvio: exampleVariantes,
      exemplosVariantesDoEnvio_DETALHE: exampleVariantes.map(v => ({
        valor: v, tamanho: v.length, charCodes: [...v].map(c => c.charCodeAt(0))
      })),
      totalChavesNoFbs: fbsKeys.length,
      exemplosChavesFbs: sampleFbs,
      exemplosChavesFbs_DETALHE: sampleFbs.map(v => ({
        valor: v, tamanho: v.length, charCodes: [...v].map(c => c.charCodeAt(0))
      })),
      colunaUsadaNoCatalogo_varianteIdentificador: colMap.varianteIdentificador,
      colunaUsadaNoFbs_idSkuVendedor: fix.colVend,
      headersDoFbs: getFbsFor(s.account)?.headers,
      headersDoCatalogo: getCatalogFor(s.account)?.headers
    };
    console.warn('[Export Shopee] Diagnóstico — nenhum item exportado:', diag);
    // Auto-download diagnostic JSON
    try{
      const blob = new Blob([JSON.stringify(diag, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'diagnostico-shopee-' + new Date().toISOString().replace(/[:.]/g,'-').slice(0,19) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }catch(e){}
    if(withVariante === 0){
      toast('Itens do envio sem "Variante Identificador". Catálogo → Aplicar padrão Shopee.','err');
    }else{
      toast(`0 matches no FBS. Arquivo "diagnostico-shopee-*.json" baixado — me envia.`,'err');
    }
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:60},{wch:22},{wch:22},{wch:30},{wch:30},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet 1');
  const acctTag2 = s.account ? '_' + SHOPEE_ACCOUNTS[s.account].label.replace(/\s+/g,'') : '';
  const fname = `ShopeeInbound${acctTag2}_${(s.code||'sem-codigo').replace(/[^a-z0-9_-]/gi,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);

  if(missing.length){
    console.warn(`[Export Shopee] ${missing.length} itens ficaram FORA da planilha (sem match no FBS):`, missing);
    toast(`Exportado: ${fbsHits} itens. ${missing.length} ficaram fora — veja console (F12).`, 'warn');
  }else{
    toast(`Planilha Shopee exportada: ${fbsHits} itens`, 'ok');
  }
}

async function downloadExtensionZip(){
  try{
    if(typeof JSZip === 'undefined'){ toast('JSZip não carregou','err'); return; }
    const zip = new JSZip();
    const folder = zip.folder('usee-hub-overlay');
    for(const [name, b64] of Object.entries(EXTENSION_FILES_B64)){
      // Decode base64 → bytes → add to zip (preserva encoding UTF-8 original)
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      folder.file(name, bytes);
    }
    const blob = await zip.generateAsync({ type:'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'usee-hub-overlay-' + new Date().toISOString().slice(0,10) + '.zip';
    a.click();
    URL.revokeObjectURL(a.href);
    toggleSideMenu(false);
    toast('Extensão baixada. Descompacte e carregue em chrome://extensions no modo desenvolvedor.','ok');
  }catch(err){ console.error(err); toast('Erro ao gerar zip da extensão: '+err.message,'err'); }
}

function exportExtensionSnapshot(){
  // Monta um snapshot leve pensado para a extensão Chrome: só o que ela precisa pra
  // casar com os cards da Shopee Seller Center (SKU → envios e vendas).
  const out = {
    version: 1,
    generatedAt: new Date().toISOString(),
    accounts: {}
  };
  for(const acct of ['moda','sports']){
    const shipments = (state.shipments || []).filter(s => s.account === acct);
    const simplified = [];
    for(const s of shipments){
      const agg = aggregateShipment(s);
      const items = [];
      const sentMap = _sentMapForShipment(s);
      for(const t of agg.totals){
        if(!t.matched) continue;
        let q = Number(t.qty)||0;
        if(sentMap){
          const eanK = String(t.ean||'').trim();
          const vidK = String(t.varianteIdentificador||'').trim();
          if(eanK && sentMap.byEan.has(eanK)) q = sentMap.byEan.get(eanK);
          else if(vidK && sentMap.byVid.has(vidK)) q = sentMap.byVid.get(vidK);
        }
        items.push({
          sku: String(t.sku||'').toUpperCase(),
          ean: String(t.ean||''),
          vid: String(t.varianteIdentificador||''),
          pid: String(t.productId||''),
          pname: String(t.productName||''),
          vname: String(t.variationName||''),
          qty: q
        });
      }
      simplified.push({
        id: s.id,
        name: s.name || '',
        code: s.code || '',
        date: s.date || '',
        sent: !!s.sent,
        sentAt: s.sentAt || null,
        cancelled: !!s.cancelled,
        items
      });
    }
    const sales = {};
    const sr = (salesReports && salesReports[acct]) || {};
    for(const mk of Object.keys(sr)){
      const items = (sr[mk] && sr[mk].items) || [];
      sales[mk] = items.map(it => ({ sku: String(it.sku||'').toUpperCase(), vname: String(it.variationName||''), qty: Number(it.qty)||0 }));
    }
    out.accounts[acct] = { shipments: simplified, sales };
  }
  const blob = new Blob([JSON.stringify(out)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'usee-hub-snapshot-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Snapshot da extensão gerado — abra o popup da extensão e importe este arquivo','ok');
}

function importAllData(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async e => {
    try{
      const d = JSON.parse(e.target.result);
      if(d.state){ state = d.state; saveState(); }
      if(d.colMap){ saveColMap(d.colMap); }
      // legacy single backup → atribui ao Sports
      if(d.catalog && !d.catalogs){ await saveCatalog('sports', d.catalog); }
      if(d.fbs && !d.fbsAll){ await saveFbs('sports', d.fbs); }
      if(d.catalogs){ for(const k of ACCOUNT_KEYS){ if(d.catalogs[k]) await saveCatalog(k, d.catalogs[k]); } }
      if(d.fbsAll){ for(const k of ACCOUNT_KEYS){ if(d.fbsAll[k]) await saveFbs(k, d.fbsAll[k]); } }
      if(d.manualEntries){ manualEntries = d.manualEntries; saveManualEntries(); }
      if(d.productImages){ for(const k of ACCOUNT_KEYS){ if(d.productImages[k]){ productImages[k] = d.productImages[k]; await saveProductImages(k); } } }
      if(d.fbsSupplements){ for(const k of ACCOUNT_KEYS){ if(d.fbsSupplements[k]){ fbsSupplements[k] = d.fbsSupplements[k]; await saveFbsSupplements(k); } } }
      if(d.productBrands){ productBrands = d.productBrands; saveProductBrands(); }
      if(d.recentProducts){ recentProducts = d.recentProducts; saveRecentProducts(); }
      if(d.salesReports){ salesReports = d.salesReports; saveSalesReports(); }
      invalidateCatalogIdx();
      toast('Backup restaurado', 'ok');
      render();
    }catch(err){ toast('Backup inválido: '+err.message,'err'); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

function buildProductsRepo(account){
  // Build a unified list of products from the catalog of this account
  const cat = getCatalogFor(account);
  if(!cat || !cat.rows.length) return [];
  const m = colMap;
  const byId = new Map();
  // FBS quick lookup (productId+varianteId → fbs row)
  const fix = indexFbsByVariante(account);
  const supplements = fbsSupplements[account] || {};
  for(const row of cat.rows){
    const pid = m.productId ? String(row[m.productId]||'').trim() : '';
    if(!pid) continue;
    const pname = m.productName ? (row[m.productName]||'') : '';
    const varId = m.varianteIdentificador ? String(row[m.varianteIdentificador]||'').trim() : '';
    const sku = m.sku ? (row[m.sku]||'') : '';
    const vname = m.variationName ? (row[m.variationName]||'') : '';
    const ean = m.ean ? String(row[m.ean]||'').trim() : '';
    if(!byId.has(pid)) byId.set(pid, { productId: pid, productName: pname, variations: [], hasFbsAll: true, hasFbsAny: false });
    const grp = byId.get(pid);
    if(!grp.productName && pname) grp.productName = pname;
    // Try FBS lookup for this variation
    let fbsRow = null;
    let fbsKind = 'none';
    if(fix){
      if(varId) fbsRow = fix.idx.get(normKey(varId));
      if(!fbsRow && ean) fbsRow = fix.idx.get(normKey(ean));
    }
    const suppKey = pid+'||'+varId;
    const supp = supplements[suppKey] || null;
    let shopSkuId = '', warehouseSkuId = '', fbsSource = 'none';
    if(fbsRow){
      shopSkuId = String(fbsRow[fix.colLoja]||'').trim();
      warehouseSkuId = String(fbsRow[fix.colArmz]||'').trim();
      fbsSource = fbsRow.__supplement ? 'supplement' : (fbsRow.__manual ? 'manual' : 'fbs');
    } else if(supp){
      shopSkuId = supp.shopSkuId || '';
      warehouseSkuId = supp.warehouseSkuId || '';
      fbsSource = 'supplement';
    }
    const hasFbs = !!(shopSkuId || warehouseSkuId);
    if(hasFbs) grp.hasFbsAny = true;
    if(!hasFbs) grp.hasFbsAll = false;
    const sup = supp || {};
    const finalVname = vname || sup.variationName || '';
    const finalSku = sku || sup.sku || '';
    const finalEan = ean || sup.ean || '';
    const incomplete = !finalVname || !finalSku || !finalEan || !varId;
    if(incomplete) grp.hasIncomplete = true;
    grp.variations.push({
      varianteIdentificador: varId, variationName: finalVname, sku: finalSku, ean: finalEan,
      origVariationName: vname, origSku: sku, origEan: ean,
      shopSkuId, warehouseSkuId, fbsSource, suppKey, incomplete
    });
  }
  return Array.from(byId.values());
}

const RECENT_PRODUCTS_KEY = 'shopeeFullManager.recentProducts.v1';
let recentProducts = (function(){ try{ return JSON.parse(localStorage.getItem(RECENT_PRODUCTS_KEY)) || {}; }catch(e){ return {}; } })();
function saveRecentProducts(){ try{ localStorage.setItem(RECENT_PRODUCTS_KEY, JSON.stringify(recentProducts)); }catch(e){} }
function trackRecentProduct(account, productId, productName){
  if(!productId) return;
  if(!recentProducts[account]) recentProducts[account] = [];
  const list = recentProducts[account].filter(x => x.productId !== productId);
  list.unshift({ productId, productName: productName || '', ts: Date.now() });
  recentProducts[account] = list.slice(0, 20);
  saveRecentProducts();
}

/* ---------- Marcas por produto (persistente em localStorage) ---------- */
const PRODUCT_BRANDS_KEY = 'shopeeFullManager.productBrands.v1';
let productBrands = (function(){ try{ return JSON.parse(localStorage.getItem(PRODUCT_BRANDS_KEY)) || {}; }catch(e){ return {}; } })();
function saveProductBrands(){ try{ localStorage.setItem(PRODUCT_BRANDS_KEY, JSON.stringify(productBrands)); }catch(e){} }
function getBrand(account, productId){ return (productBrands[account] && productBrands[account][productId]) || ''; }
function setBrand(account, productId, brand){
  if(!productBrands[account]) productBrands[account] = {};
  const b = String(brand||'').trim();
  if(b) productBrands[account][productId] = b;
  else delete productBrands[account][productId];
  saveProductBrands();
}
function getAllBrandsFor(account){
  const map = productBrands[account] || {};
  const set = new Set();
  for(const pid in map){ if(map[pid]) set.add(map[pid]); }
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'pt-BR', { sensitivity:'base' }));
}
function promptEditBrand(account, productId, currentBrand){
  const existing = getAllBrandsFor(account);
  const hint = existing.length ? '\n\nMarcas já cadastradas: ' + existing.join(', ') : '';
  const v = prompt('Marca do produto (deixe vazio para remover):' + hint, currentBrand || '');
  if(v === null) return; // cancelou
  setBrand(account, productId, v);
  openProductRepoModal();
}

function _splitVariationNameParts(name){
  const s = String(name||'').trim();
  if(!s) return { group:'', size:'' };
  const idx = s.indexOf(',');
  if(idx < 0) return { group: s.trim(), size: '' };
  return { group: s.slice(0, idx).trim(), size: s.slice(idx+1).trim() };
}
function _buildMonthlyChartForProduct(account, productId, nMonths, filters){
  // Soma envios mês a mês (últimos nMonths meses), priorizando a conferência real sobre o planejado.
  nMonths = nMonths || 12;
  const fVar = (filters && filters.variation && filters.variation !== 'all') ? filters.variation : null;
  const fSize = (filters && filters.size && filters.size !== 'all') ? filters.size : null;
  const now = new Date();
  const monthShort = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const months = [];
  for(let i = nMonths - 1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({
      key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'),
      label: monthShort[d.getMonth()] + '/' + String(d.getFullYear()).slice(2),
      qty: 0
    });
  }
  const monthIndex = new Map(months.map((m,i) => [m.key, i]));
  for(const sh of state.shipments){
    if(sh.account !== account) continue;
    if(sh.cancelled) continue;
    const dateStr = sh.sentAt ? sh.sentAt.slice(0,10) : (sh.date || '');
    if(!dateStr) continue;
    const mKey = dateStr.slice(0, 7);
    if(!monthIndex.has(mKey)) continue;
    const agg = aggregateShipment(sh);
    const matched = agg.totals.filter(t => t.matched && t.productId === productId);
    if(!matched.length) continue;
    const sentMap = _sentMapForShipment(sh);
    for(const t of matched){
      // Aplica filtros de variação e tamanho
      if(fVar || fSize){
        const parts = _splitVariationNameParts(t.variationName);
        if(fVar && parts.group !== fVar) continue;
        if(fSize && parts.size !== fSize) continue;
      }
      let q = 0;
      if(sentMap){
        const eanK = String(t.ean||'').trim();
        const vidK = String(t.varianteIdentificador||'').trim();
        if(eanK && sentMap.byEan.has(eanK)) q = sentMap.byEan.get(eanK);
        else if(vidK && sentMap.byVid.has(vidK)) q = sentMap.byVid.get(vidK);
      } else {
        q = Number(t.qty)||0;
      }
      months[monthIndex.get(mKey)].qty += q;
    }
  }
  return months;
}
function _buildMonthlySalesForProduct(account, productId, nMonths, filters){
  // Soma vendas mês a mês vindas dos relatórios de vendas importados (zip Shopee)
  nMonths = nMonths || 12;
  const fVar = (filters && filters.variation && filters.variation !== 'all') ? filters.variation : null;
  const fSize = (filters && filters.size && filters.size !== 'all') ? filters.size : null;
  const now = new Date();
  const monthShort = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const months = [];
  for(let i = nMonths - 1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({
      key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'),
      label: monthShort[d.getMonth()] + '/' + String(d.getFullYear()).slice(2),
      qty: 0
    });
  }
  const monthIndex = new Map(months.map((m,i) => [m.key, i]));
  const reports = (typeof salesReports !== 'undefined' && salesReports && salesReports[account]) || {};
  // Monta um mapa dos SKUs do produto no catálogo (coluna S = SKU do vendedor nas planilhas).
  // Para cada SKU guardamos qual variação ele representa, para aplicar os filtros de variação/tamanho.
  const repo = (typeof buildProductsRepo === 'function') ? buildProductsRepo(account) : [];
  const prod = repo.find(x => String(x.productId) === String(productId));
  const skuMap = new Map(); // SKU normalizado → { group, size }
  if(prod && prod.variations){
    for(const v of prod.variations){
      const sku = String(v.sku||'').trim().toUpperCase();
      if(!sku) continue;
      const parts = _splitVariationNameParts(v.origVariationName || v.variationName || '');
      skuMap.set(sku, parts);
    }
  }
  if(!skuMap.size) return months;
  for(const mKey of Object.keys(reports)){
    if(!monthIndex.has(mKey)) continue;
    const items = (reports[mKey] && reports[mKey].items) || [];
    for(const it of items){
      const sku = String(it.sku||'').trim().toUpperCase();
      if(!sku) continue;
      const parts = skuMap.get(sku);
      if(!parts) continue; // SKU não pertence a este produto
      if(fVar && parts.group !== fVar) continue;
      if(fSize && parts.size !== fSize) continue;
      months[monthIndex.get(mKey)].qty += Number(it.qty)||0;
    }
  }
  return months;
}
let _productChartMonths = 5; // padrão de 5 meses
let _productChartVariation = 'all';
let _productChartSize = 'all';
function setProductChartPeriod(n, productId){
  _productChartMonths = Number(n) || 5;
  openProductChartModal(productId);
}
function setProductChartVariation(v, productId){
  _productChartVariation = v || 'all';
  _productChartSize = 'all'; // reset size quando muda variação
  openProductChartModal(productId);
}
function setProductChartSize(v, productId){
  _productChartSize = v || 'all';
  openProductChartModal(productId);
}
function _renderProductMonthlyChart(account, productId){
  const nMonths = _productChartMonths || 5;
  // Lista variações e tamanhos únicos deste produto
  const repoForChart = buildProductsRepo(account);
  const pForChart = repoForChart.find(x => x.productId === productId);
  const allParts = (pForChart && pForChart.variations ? pForChart.variations : []).map(v => _splitVariationNameParts(v.origVariationName || v.variationName));
  const uniqueVariations = Array.from(new Set(allParts.map(p => p.group).filter(Boolean))).sort((a,b) => a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
  const variationFilter = _productChartVariation;
  // Tamanhos: se tem variação selecionada, filtra tamanhos pertencentes a ela; senão todos os tamanhos únicos
  let sizesInScope = allParts.filter(p => !variationFilter || variationFilter === 'all' || p.group === variationFilter).map(p => p.size).filter(Boolean);
  const uniqueSizes = Array.from(new Set(sizesInScope)).sort((a,b) => {
    const na = parseInt(a,10), nb = parseInt(b,10);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'});
  });
  const monthsSent = _buildMonthlyChartForProduct(account, productId, nMonths, { variation: _productChartVariation, size: _productChartSize });
  const monthsSold = _buildMonthlySalesForProduct(account, productId, nMonths, { variation: _productChartVariation, size: _productChartSize });
  const months = monthsSent.map((m,i) => ({ key: m.key, label: m.label, sent: m.qty, sold: (monthsSold[i] && monthsSold[i].qty) || 0 }));
  const maxQty = Math.max(1, ...months.map(m => Math.max(m.sent, m.sold)));
  const totalSent = months.reduce((a,m) => a + m.sent, 0);
  const totalSold = months.reduce((a,m) => a + m.sold, 0);
  const hasSoldData = months.some(m => m.sold > 0);
  // viewBox fixo + preserveAspectRatio padrão (xMidYMid meet) → nada se distorce
  const W = 900, H = 340;
  const padL = 50, padR = 20, padT = 36, padB = 46;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const stepX = chartW / Math.max(1, months.length - 1);
  const COLOR_SENT = 'var(--accent)';        // ciano/azul = Enviado
  const COLOR_SOLD = '#ff9d3b';              // laranja  = Vendido no Full
  const ptsSent = months.map((m,i) => ({ x: padL + i * stepX, y: padT + chartH * (1 - m.sent / maxQty), v: m.sent, label: m.label }));
  const ptsSold = months.map((m,i) => ({ x: padL + i * stepX, y: padT + chartH * (1 - m.sold / maxQty), v: m.sold, label: m.label }));
  const pathSent = ptsSent.map((p,i) => (i===0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const pathSold = ptsSold.map((p,i) => (i===0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const areaSent = pathSent + ` L ${(padL + chartW).toFixed(1)} ${(padT + chartH).toFixed(1)} L ${padL.toFixed(1)} ${(padT + chartH).toFixed(1)} Z`;
  // Y gridlines
  const yTicks = [0, Math.ceil(maxQty/2), maxQty];
  const yGrid = yTicks.map(v => {
    const y = padT + chartH * (1 - v / maxQty);
    return `<line x1="${padL}" y1="${y}" x2="${padL+chartW}" y2="${y}" stroke="var(--line)" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>
            <text x="${padL-8}" y="${y+5}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Poppins">${v}</text>`;
  }).join('');
  const xLabels = ptsSent.map(p => `<text x="${p.x.toFixed(1)}" y="${(padT+chartH+22).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Poppins">${p.label}</text>`).join('');
  // Pontos de ambas as séries
  const dotsSent = ptsSent.map(p => p.v > 0
    ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${COLOR_SENT}" stroke="var(--panel)" stroke-width="2"><title>${p.label} · Enviado: ${p.v} un</title></circle>`
    : '').join('');
  const dotsSold = hasSoldData ? ptsSold.map(p => p.v > 0
    ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${COLOR_SOLD}" stroke="var(--panel)" stroke-width="2"><title>${p.label} · Vendido: ${p.v} un</title></circle>`
    : '').join('') : '';
  // Rótulos numéricos. Se os dois valores existirem num mês, coloca o Enviado acima e o Vendido abaixo para não sobrepor.
  const valueLabels = months.map((m,i) => {
    const pS = ptsSent[i], pV = ptsSold[i];

    }
    if(m.sold > 0){

      const close = m.sent > 0 && Math.abs(pS.y - pV.y) < 18;
      const yPos = close ? (pV.y + 16) : (pV.y - 10);
      out += `<text x="${pV.x.toFixed(1)}" y="${yPos.toFixed(1)}" text-anchor="middle" font-size="11" fill="${COLOR_SOLD}" font-weight="700" font-family="Poppins">${m.sold}</text>`;
    }
    return out;

  const gradId = 'gradArea_'+String(productId).replace(/[^a-zA-Z0-9]/g,'_');

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:10px">

          <select onchange="setProductChartPeriod(this.value,'${escapeHtml(productId)}')" style="background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11.5px;font-weight:600;cursor:pointer" title="Período">
            <option value="3" ${nMonths===3?'selected':''}>Últimos 3 meses</option>

async function saveProductRepoEdit(productId){
  const account = modalAccount;
  const rows = document.querySelectorAll('[data-suppkey]');
  let saved = 0;
  for(const row of rows){
    const suppKey = row.dataset.suppkey;
    const shopSkuId = row.querySelector('.repo-shop').value.trim();
    const warehouseSkuId = row.querySelector('.repo-warehouse').value.trim();
    const variationName = row.querySelector('.repo-vname').value.trim();
    const sku = row.querySelector('.repo-sku').value.trim();
    const ean = row.querySelector('.repo-ean').value.trim();
    const payload = {};
    if(shopSkuId) payload.shopSkuId = shopSkuId;
    if(warehouseSkuId) payload.warehouseSkuId = warehouseSkuId;
    if(variationName) payload.variationName = variationName;
    if(sku) payload.sku = sku;
    if(ean) payload.ean = ean;
    if(Object.keys(payload).length){
      await setFbsSupplement(account, suppKey, payload);
      saved++;
    } else {
      await setFbsSupplement(account, suppKey, null);
    }
  }
  toast(`${saved} variação${saved===1?'':'ões'} de FBS salvos`, 'ok');
  openProductRepoModal();
  render();
}

async function handleProductImagesFile(file){
  if(!modalAccount){ toast('Selecione a aba da conta antes de importar','err'); return; }
  try{
    const ext = file.name.toLowerCase().split('.').pop();
    let htmlText = null;
    if(ext === 'zip'){
      toast('Descompactando .zip...','');
      const buf = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      // Find first .html inside (preferring largest)
      const candidates = Object.keys(zip.files).filter(n =>
        !n.startsWith('__MACOSX') && !zip.files[n].dir && /\.html?$/i.test(n)
      );
      if(!candidates.length){ toast('Nenhum .html encontrado dentro do zip','err'); return; }
      let best = candidates[0], maxLen = 0;
      for(const n of candidates){
        const t = await zip.files[n].async('string');
        if(t.length > maxLen){ maxLen = t.length; best = n; htmlText = t; }
      }
    } else if(ext === 'html' || ext === 'htm'){
      htmlText = await file.text();
    } else {
      toast('Formato não suportado. Use .html ou .zip','err'); return;
    }
    if(!htmlText){ toast('Falha ao ler conteúdo','err'); return; }
    // Parse with DOMParser
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    const rows = doc.querySelectorAll('table tbody tr, table tr');
    let added = 0, skipped = 0;
    const map = productImages[modalAccount] || {};
    // Try to detect column positions: assume col A=Shop ID, C=Item ID, F=Link Primeira Imagem (4th, 5th, 7th td including header) — Google sheets puts row-header th + 7 tds
    for(const row of rows){
      const cells = row.querySelectorAll('td');
      if(cells.length < 6) continue; // need at least F
      // Item ID is usually 3rd td (index 2) — col C
      let productId = (cells[2]?.textContent || '').trim();
      // Skip header row or empty
      if(!productId || !/^\d{5,}$/.test(productId)) continue;
      // Image URL: try col F (index 5) first — has <a href> with Shopee CDN URL
      let imgUrl = '';
      const linkInF = cells[5]?.querySelector('a[href]');
      if(linkInF) imgUrl = linkInF.getAttribute('href');
      if(!imgUrl){
        // Fall back to <img src> in col G (index 6)
        const imgInG = cells[6]?.querySelector('img[src]');
        if(imgInG) imgUrl = imgInG.getAttribute('src');
      }
      if(!imgUrl){
        // Try any img in any cell
        for(const c of cells){
          const im = c.querySelector('img[src]');
          if(im){ imgUrl = im.getAttribute('src'); break; }
        }
      }
      if(!imgUrl){ skipped++; continue; }
      map[productId] = imgUrl;
      added++;
    }
    productImages[modalAccount] = map;
    await saveProductImages(modalAccount);
    toast(`Imagens importadas: ${added} produtos (${skipped} sem imagem)`, 'ok');
    openCatalogModal();
    render();
  }catch(err){
    console.error(err);
    toast('Erro lendo arquivo de imagens: '+err.message,'err');
  }
}

async function setProductImage(account, productId, url){
  if(!account || !productId) return;
  if(!productImages[account]) productImages[account] = {};
  if(url) productImages[account][String(productId).trim()] = url;
  else delete productImages[account][String(productId).trim()];
  await saveProductImages(account);
}
async function removeProductImage(account, productId){
  if(!account || !productId) return;
  if(!productImages[account]) return;
  delete productImages[account][String(productId)];
  await saveProductImages(account);
}
async function uploadLocalImageForProduct(account, productId, file){
  if(!file) return;
  if(file.size > 2 * 1024 * 1024){ toast('Imagem muito grande (max 2MB)','err'); return; }
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = async e => {
      try {
        await setProductImage(account, productId, e.target.result);
        toast('Imagem do produto '+productId+' atualizada','ok');
        resolve();
      } catch(err){ toast('Falha: '+err.message,'err'); reject(err); }
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

/* ---------- Histórico consolidado por conta / produto ---------- */
function _currentMonth(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
const _historyFilter = { search:'', sentOnly:false, month:_currentMonth() };
function _shipmentMonth(s){
  const d = s.sentAt || s.date || s.createdAt || '';
  return (typeof d === 'string' && d.length >= 7) ? d.slice(0,7) : '';
}
function _sentMapForShipment(s){
  // Se o envio tem planilhas de "Conferência de Envio Real", devolve maps por EAN e Model ID
  // com as quantidades realmente enviadas. Devolve null quando não há conferência.
  let saList = Array.isArray(s.sentActual) ? s.sentActual : (s.sentActual ? [s.sentActual] : []);
  if(!saList.length) return null;
  const byEan = new Map();
  const byVid = new Map();
  for(const sa of saList){
    for(const it of (sa.items||[])){
      const q = Number(it.qty)||0;
      if(it.ean){ const k=String(it.ean).trim(); byEan.set(k,(byEan.get(k)||0)+q); }
      if(it.cProd){ const k=String(it.cProd).trim(); byVid.set(k,(byVid.get(k)||0)+q); }
    }
  }
  return { byEan, byVid };
}
function buildHistoryFor(account){
  const map = new Map(); // productId -> { productId, productName, productImage, totalQty, variations, shipments }
  for(const s of state.shipments){
    if(s.account !== account) continue;
    if(s.cancelled) continue; // envios "Não enviado" não contam no Histórico
    if(_historyFilter.sentOnly && !s.sent) continue;
    if(_historyFilter.month && _shipmentMonth(s) !== _historyFilter.month) continue;
    const agg = aggregateShipment(s);
    const sentMap = _sentMapForShipment(s);
    for(const t of agg.totals){
      if(!t.matched || !t.productId) continue;
      const pid = t.productId;
      if(!map.has(pid)){
        map.set(pid, {
          productId: pid,
          productName: t.productName || '',
          productImage: t.productImage || '',
          totalQty: 0,
          variations: new Map(),
          shipments: new Map()
        });
      }
      const entry = map.get(pid);
      // Prioriza a quantidade EFETIVAMENTE enviada quando houver conferência.
      let q = 0;
      if(sentMap){
        const eanK = String(t.ean||'').trim();
        const vidK = String(t.varianteIdentificador||'').trim();
        if(eanK && sentMap.byEan.has(eanK)) q = sentMap.byEan.get(eanK);
        else if(vidK && sentMap.byVid.has(vidK)) q = sentMap.byVid.get(vidK);
        else q = 0;
      } else {
        q = Number(t.qty)||0;
      }
      entry.totalQty += q;
      if(!entry.productName && t.productName) entry.productName = t.productName;
      if(!entry.productImage && t.productImage) entry.productImage = t.productImage;
      const vkey = (t.varianteIdentificador||'') + '||' + (t.sku||'') + '||' + (t.ean||'');
      if(!entry.variations.has(vkey)){
        entry.variations.set(vkey, { name:t.variationName||'—', sku:t.sku||'', ean:t.ean||'', varId:t.varianteIdentificador||'', qty:0 });
      }
      entry.variations.get(vkey).qty += q;
      if(!entry.shipments.has(s.id)){
        entry.shipments.set(s.id, { id:s.id, name:s.name||'', code:s.code||'', date:s.date||s.sentAt||s.createdAt||'', sent:!!s.sent, qty:0 });
      }
      entry.shipments.get(s.id).qty += q;
    }
  }
  return Array.from(map.values()).sort((a,b)=>b.totalQty - a.totalQty);
}
/* ---------- Calendário de envios ---------- */
let _calendarMonth = null; // {y, m} — null = mês atual
function _calKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function _parseDateLocal(s){ if(!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; return new Date(Number(m[1]), Number(m[2])-1, Number(m[3])); }
function openCalendarModal(opts){
  opts = opts || {};
  if(opts.monthDelta){ _calendarMonth = _calendarMonth || { y: new Date().getFullYear(), m: new Date().getMonth() }; let m = _calendarMonth.m + opts.monthDelta; let y = _calendarMonth.y; while(m<0){m+=12;y--;} while(m>11){m-=12;y++;} _calendarMonth = {y,m}; }
  if(opts.reset){ _calendarMonth = null; }
  const now = new Date();
  const cur = _calendarMonth || { y: now.getFullYear(), m: now.getMonth() };
  const first = new Date(cur.y, cur.m, 1);
  const monthName = first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  // Collect shipments by date (yyyy-mm-dd)
  const byDate = {};
  for(const s of (state.shipments||[])){
    const dateStr = s.date || (s.sentAt ? s.sentAt.slice(0,10) : null);
    if(!dateStr) continue;
    const key = String(dateStr).slice(0,10);
    (byDate[key] = byDate[key] || []).push(s);

  // Build 6-week grid starting Sunday
  const startWeekday = first.getDay(); // 0=Dom

    for(const s of byDate[k]){

              <button class="btn ghost sm" onclick="openCalendarModal({monthDelta:-1})" style="padding:6px 10px">← Mês anterior</button>
              <div style="font-weight:800;font-size:16px;text-transform:capitalize">${monthName}</div>
              <div class="row" style="gap:6px">
                <button class="btn ghost sm" onclick="openCalendarModal({reset:true})" style="padding:6px 10px" title="Voltar ao mês atual">Hoje</button>
                <button class="btn ghost sm" onclick="openCalendarModal({monthDelta:1})" style="padding:6px 10px">Próximo mês →</button>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">
              ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(w=>`<div style="text-align:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:4px 0">${w}</div>`).join('')}
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
              ${days.map(d => {
                const inMonth = d.getMonth() === cur.m;

                const ships = byDate[key] || [];
                const isToday = d.getTime() === today.getTime();
                const isPast = d < today;
                const isSelected = key === selectedKey;

                  if(anyPendingFuture) dotHtml += '<span style="width:6px;height:6px;border-radius:50%;background:#f59e0b;display:inline-block"></span>';
                  if(anyPendingPast) dotHtml += '<span style="width:6px;height:6px;border-radius:50%;background:#ef4444;display:inline-block"></span>';
                  if(anyCancelled) dotHtml += '<span style="width:6px;height:6px;border-radius:50%;background:#9ca3af;display:inline-block"></span>';

/* ---------- Total Consolidado helpers ---------- */
function groupMatchedByProduct(matched, s){
  const m = new Map();
  for(const t of matched){
    const pid = t.productId || '(sem ID)';
    if(!m.has(pid)) m.set(pid, { productId: pid, productName: '', items: [], totalOriginalQty: 0, totalExportQty: 0, hasCustom: false });
    const g = m.get(pid);
    g.items.push(t);
    if(!g.productName && t.productName) g.productName = t.productName;
    if(!g.productImage && t.productImage) g.productImage = t.productImage;
    const key = `${t.productId}||${t.varianteIdentificador||''}||${t.sku||''}`;
    const exportQty = (s.customQty && s.customQty[key] != null) ? Number(s.customQty[key]) : Number(t.qty)||0;
    g.totalOriginalQty += Number(t.qty)||0;
    g.totalExportQty += exportQty;
    if(s.customQty && s.customQty[key] != null && s.customQty[key] !== t.qty) g.hasCustom = true;
    if(t.manualMatch) g.hasManual = true;
  }
  // sort by total qty desc
  return Array.from(m.values()).sort((a,b) => b.totalExportQty - a.totalExportQty);
}

function variationOverrideKey(t){ return `${t.productId}||${t.varianteIdentificador||''}||${t.sku||''}||${normEan(t.ean||'')}`; }
function applyVariationOverrides(s, t){
  if(!s || !s.variationOverrides) return t;
  const k = variationOverrideKey(t);
  const ov = s.variationOverrides[k];
  if(!ov) return t;
  return {
    ...t,
    variationName: (ov.variationName!=null && ov.variationName!=='') ? ov.variationName : t.variationName,
    sku:           (ov.sku!=null && ov.sku!=='')           ? ov.sku           : t.sku,
    varianteIdentificador: (ov.varianteIdentificador!=null && ov.varianteIdentificador!=='') ? ov.varianteIdentificador : t.varianteIdentificador,
    ean:           (ov.ean!=null && ov.ean!=='')           ? ov.ean           : t.ean,
    _overridden: true
  };
}

function saveEditVariations(shipmentId, productId){
  const s = getShipment(shipmentId); if(!s) return;
  if(!s.variationOverrides) s.variationOverrides = {};
  if(!s.customQty) s.customQty = {};
  const rows = document.querySelectorAll('[data-okey]');
  let changed = 0;
  rows.forEach(row => {
    const k = row.dataset.okey;
    // Build the customQty key from the override key (remove the last segment which is EAN)
    const lastSep = k.lastIndexOf('||');
    const qtyKey = lastSep > 0 ? k.slice(0, lastSep) : k;
    const ov = {};
    const vname = row.querySelector('.ev-vname').value.trim();
    const sku = row.querySelector('.ev-sku').value.trim();
    const vid = row.querySelector('.ev-vid').value.trim();
    const ean = row.querySelector('.ev-ean').value.trim();
    const qty = row.querySelector('.ev-qty').value.trim();
    if(vname) ov.variationName = vname;
    if(sku) ov.sku = sku;
    if(vid) ov.varianteIdentificador = vid;
    if(ean) ov.ean = ean;
    if(Object.keys(ov).length){ s.variationOverrides[k] = ov; changed++; }
    else delete s.variationOverrides[k];
    if(qty !== '' && !isNaN(Number(qty))){
      const origQty = Number(row.dataset.origQty);
      if(Number(qty) !== origQty) s.customQty[qtyKey] = Number(qty);
      else delete s.customQty[qtyKey];
    } else {
      delete s.customQty[qtyKey];
    }
  });
  saveState();
  toast(`Alterações salvas (${changed} variação${changed===1?'':'ões'} editadas)`, 'ok');
  closeModal();
  render();
}
function resetVariationOverrides(shipmentId, productId){
  const s = getShipment(shipmentId); if(!s) return;
  if(s.variationOverrides){
    Object.keys(s.variationOverrides).forEach(k => {
      if(k.startsWith(productId + '||')) delete s.variationOverrides[k];
    });
  }
  if(s.customQty){
    Object.keys(s.customQty).forEach(k => {
      if(k.startsWith(productId + '||')) delete s.customQty[k];
    });
  }
  saveState();
  toast('Edições do produto resetadas','ok');
  closeModal();
  render();
}

function _autoColorFor(groupName){
  const palette = ['#ef4444','#f59e0b','#eab308','#84cc16','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#14b8a6','#a855f7'];
  let h = 0; for(let i=0;i<groupName.length;i++) h = (h*31 + groupName.charCodeAt(i)) | 0;
  return palette[Math.abs(h) % palette.length];

function getVariationColors(account, productId, groupName){
  // Retorna [cor1, cor2] onde cor2 pode ser null (sem split diagonal)
  const key = `${account||''}||${productId}||${groupName}`;
  const stored = variationColors[key];
  if(Array.isArray(stored)) return [stored[0] || _autoColorFor(groupName), stored[1] || null];
  if(typeof stored === 'string') return [stored, null];
  return [_autoColorFor(groupName), null];
}

function getVariationColor(account, productId, groupName){ return getVariationColors(account, productId, groupName)[0]; }
function setVariationColors(account, productId, groupName, c1, c2, shipmentId){
  const key = `${account||''}||${productId}||${groupName}`;
  const _c2 = c2 || null;
  if(!c1 && !_c2){ delete variationColors[key]; }
  else { variationColors[key] = [c1 || _autoColorFor(groupName), _c2]; }
  saveVariationColors();
  if(shipmentId){ openProductDrawer(shipmentId, productId, _lastDrawerFilter); }
}
function setVariationColor(account, productId, groupName, color, shipmentId){
  // Compat: altera só a cor primária, preservando a secundária se houver
  const [, c2] = getVariationColors(account, productId, groupName);
  setVariationColors(account, productId, groupName, color, c2, shipmentId);
}

function refreshDrawerTotal(shipmentId, productId, filter){
  const s = getShipment(shipmentId); if(!s) return;

/* ---------- Abrir arquivo original da NF ---------- */
function openNoteFileXmlOnly(shipmentId, noteId){
  const s = getShipment(shipmentId); if(!s) return;
  const nf = s.notes.find(n => n.id === noteId);
  if(!nf || !nf.xmlText){ toast('XML não armazenado','warn'); return; }
  const blob = new Blob([nf.xmlText], { type:'application/xml' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank', 'noopener,noreferrer');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function openNoteFile(shipmentId, noteId){
  const s = getShipment(shipmentId); if(!s) return;
  const nf = s.notes.find(n => n.id === noteId);
  if(!nf){ toast('Nota não encontrada','err'); return; }
  // 1) PDF original importado tem prioridade
  if(nf.pdfBase64){
    try{
      const byteString = atob(nf.pdfBase64);
      const bytes = new Uint8Array(byteString.length);
      for(let i=0;i<byteString.length;i++) bytes[i] = byteString.charCodeAt(i);
      const blob = new Blob([bytes], { type:'application/pdf' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank', 'noopener,noreferrer');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return;
    }catch(e){ console.error('Falha ao decodificar PDF:', e); }
  }
  // 2) Gerar DANFE PDF a partir dos dados parseados (XML ou PDF best-effort)
  if(nf.items && nf.items.length){
    try{
      generateDanfePdf(nf);
      return;
    }catch(e){ console.error('Falha ao gerar DANFE:', e); }
  }
  // 3) Fallback: abrir XML cru se disponível
  if(nf.xmlText){
    const blob = new Blob([nf.xmlText], { type:'application/xml' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank', 'noopener,noreferrer');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return;
  }
  toast('Arquivo original não disponível. Re-importe a nota.','warn');
}

function generateDanfePdf(nf){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('jsPDF não carregou (cheque sua internet)','err'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W = 210, M = 10;
  let y = M;

  // ----- Header bar
  doc.setFillColor(20,20,20).rect(M, y, W-2*M, 12, 'F');
  doc.setTextColor(255,255,255).setFontSize(13).setFont('helvetica','bold');
  doc.text('DANFE — Documento Auxiliar da NF-e', M+3, y+8);
  doc.setTextColor(0,0,0);
  y += 16;

  // ----- NF info box
  doc.setDrawColor(0).setLineWidth(0.2);
  doc.rect(M, y, W-2*M, 22);
  doc.setFontSize(9).setFont('helvetica','bold').text('Nº NF-e', M+3, y+5);
  doc.setFont('helvetica','normal').setFontSize(14).text(String(nf.nNF||'—'), M+3, y+12);
  doc.setFontSize(9).setFont('helvetica','bold').text('Série', M+50, y+5);
  doc.setFont('helvetica','normal').setFontSize(12).text(String(nf.serie||'—'), M+50, y+12);
  doc.setFontSize(9).setFont('helvetica','bold').text('Data de Emissão', M+80, y+5);
  doc.setFont('helvetica','normal').setFontSize(11).text(nf.dEmi ? fmtDate(nf.dEmi) : '—', M+80, y+12);
  if(nf.source){
    doc.setFontSize(8).setFont('helvetica','italic').setTextColor(120,120,120)
       .text('fonte: '+nf.source.toUpperCase(), W-M-3, y+5, { align:'right' });
    doc.setTextColor(0,0,0);
  }
  if(nf.chave){
    doc.setFontSize(8).setFont('helvetica','bold').text('Chave de Acesso:', M+3, y+18);
    doc.setFont('helvetica','normal').setFont('courier','normal');
    doc.text(nf.chave.replace(/(\d{4})/g,'$1 ').trim(), M+30, y+18);
    doc.setFont('helvetica','normal');
  }
  y += 26;

  // ----- Emitente
  if(nf.emitNome){
    doc.rect(M, y, W-2*M, 12);
    doc.setFontSize(9).setFont('helvetica','bold').text('Emitente', M+3, y+5);
    doc.setFont('helvetica','normal').setFontSize(11).text(String(nf.emitNome).slice(0,90), M+3, y+10);
    y += 14;
  }

  // ----- Volumes
  if(nf.volumes || (nf.volumeDetails && nf.volumeDetails.length)){
    doc.rect(M, y, W-2*M, 10);
    doc.setFontSize(9).setFont('helvetica','bold').text('Volumes', M+3, y+5);
    let volStr = '';
    if(nf.volumeDetails && nf.volumeDetails.length){
      volStr = nf.volumeDetails.map(v => `${v.qVol} ${v.esp||''}`).join(' · ');
    } else { volStr = String(nf.volumes||0); }
    doc.setFont('helvetica','normal').setFontSize(11).text(volStr, M+30, y+7);
    y += 12;
  }

  // ----- Items table
  doc.setFontSize(9).setFont('helvetica','bold').text(`Itens da Nota (${nf.items.length})`, M, y+5);
  y += 7;

  const body = nf.items.map((it,i)=> [
    i+1,
    String(it.cProd||''),
    String(it.ean||''),
    String(it.xProd||'').slice(0,80),
    Number(it.qty||0).toLocaleString('pt-BR'),
    String(it.unit||'')
  ]);
  doc.autoTable({
    startY: y,
    head: [['#','Cód','EAN','Descrição','Qtd','Un']],
    body,
    styles: { fontSize: 8, cellPadding: 1.4, lineColor: [180,180,180], lineWidth: 0.1 },
    headStyles: { fillColor: [240,240,240], textColor: [0,0,0], fontStyle:'bold', lineWidth:0.2 },
    columnStyles: {
      0: { cellWidth: 8, halign:'right' },
      1: { cellWidth: 22, font:'courier', fontSize:7 },
      2: { cellWidth: 26, font:'courier', fontSize:7 },
      3: { cellWidth: 'auto' },
      4: { cellWidth: 16, halign:'right' },
      5: { cellWidth: 12, halign:'center' }
    },
    margin: { left: M, right: M }
  });

  // ----- Footer
  const pageCount = doc.internal.getNumberOfPages();
  for(let p=1; p<=pageCount; p++){
    doc.setPage(p);
    doc.setFontSize(7).setTextColor(120,120,120).setFont('helvetica','italic');
    doc.text(`DANFE simplificada gerada por Usee Brasil · Gestor Full Shopee — ${new Date().toLocaleString('pt-BR')}`, M, 290);
    doc.text(`Página ${p}/${pageCount}`, W-M, 290, { align:'right' });
  }

  // Open in new tab
  const url = URL.createObjectURL(doc.output('blob'));
  window.open(url, '_blank', 'noopener,noreferrer');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ---------- Identificador copiável do envio ---------- */
function shipmentIdentifierText(s){
  const nfNums = (s.notes||[]).map(n => n.nNF).filter(Boolean);
  const hubNums = (s.hubOrders||[]).map(h => h.pedidoNum).filter(Boolean);
  const mixed = nfNums.length && hubNums.length;
  const noteLabel = nfNums.length === 1 ? 'Nota' : 'Notas';
  if(mixed){
    return 'Full ' + noteLabel + ' (' + nfNums.join(' / ') + ') + Cross (' + hubNums.join(' / ') + ')';
  }
  if(nfNums.length){
    return 'Full ' + noteLabel + ' ' + nfNums.join(' / ');
  }
  if(hubNums.length){
    return 'Full Cross ' + hubNums.join(' / ');
  }
  return '';
}

function pencilIcon(){

function statBox(key, label, originalVal, overrideVal, color){
  const c = color || 'var(--txt-strong)';
  const isOver = (overrideVal != null && overrideVal !== '' && Number(overrideVal) !== Number(originalVal));
  const shown = isOver ? overrideVal : originalVal;
  return `

      <div class="l">${label}</div>
      ${isOver ? `<div class="stat-orig" title="Valor original do sistema">original: ${originalVal}</div>` : ''}
      <button class="stat-edit" title="Editar manualmente" onclick="editStatOverride('${key}', ${originalVal}, ${isOver?overrideVal:'null'})">${pencilIcon()}</button>
    </div>`;

function editStatOverride(key, originalVal, currentOverride){
  const s = getShipment(route.shipmentId); if(!s) return;
  if(!s.statOverrides) s.statOverrides = {};
  const labels = { items:'Variações Totais', qty:'Qtd. Total de Itens', volumes:'Volumes (caixas)', notes:'Notas Fiscais', hub:'Pedidos Cross' };
  const wrap = document.getElementById('modalWrap');
  wrap.innerHTML = `
    <div class="modal" onclick="if(event.target===this) closeModal()">
      <div class="box" style="max-width:420px">
        <h3>Editar ${labels[key]||key}</h3>
        <div class="kv" style="margin-bottom:12px">
          <div class="k">Original (sistema)</div><div><strong style="color:var(--muted)">${originalVal}</strong></div>
        </div>
        <div class="field">
          <label>Valor editado</label>
          <input id="statEditInput" type="number" min="0" step="1" value="${currentOverride!=null?currentOverride:originalVal}" autofocus />
        </div>
        <div class="small" style="margin-top:8px;color:var(--muted)">O valor exibido será o editado; o original fica visível em pequeno abaixo.</div>
        <div class="row" style="justify-content:space-between;margin-top:14px">
          <button class="btn ghost" onclick="resetStatOverride('${key}')" ${currentOverride==null?'disabled style=opacity:.4':''}>↺ Resetar ao original</button>
          <div class="row" style="gap:6px">
            <button class="btn secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn success" onclick="saveStatOverride('${key}', ${originalVal})">Salvar</button>
          </div>
        </div>
      </div>
    </div>
  `;
  setTimeout(()=>{ const i=document.getElementById('statEditInput'); if(i){i.focus();i.select();} }, 50);
}
function saveStatOverride(key, originalVal){
  const s = getShipment(route.shipmentId); if(!s) return;
  if(!s.statOverrides) s.statOverrides = {};
  const v = document.getElementById('statEditInput').value.trim();
  if(v === '' || isNaN(Number(v))){ toast('Valor inválido','err'); return; }
  const num = Number(v);
  if(num === Number(originalVal)){
    delete s.statOverrides[key]; // se igual ao original, descarta override
  } else {
    s.statOverrides[key] = num;
  }
  saveState();
  closeModal();
  render();
}
function resetStatOverride(key){
  const s = getShipment(route.shipmentId); if(!s) return;
  if(s.statOverrides) delete s.statOverrides[key];
  saveState();
  closeModal();
  render();
}
