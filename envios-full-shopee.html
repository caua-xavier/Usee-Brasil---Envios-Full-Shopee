const LIST_FILTER_KEY = 'shopeeFullManager.listFilter.v1';
let listFilter = (function(){
  try{ const v = JSON.parse(localStorage.getItem(LIST_FILTER_KEY)) || {}; return Object.assign({ search:'', sortBy:'createdAt-desc', status:'all', account:'all', viewMode:'grid' }, v); }
  catch(e){ return { search:'', sortBy:'createdAt-desc', status:'all', account:'all', viewMode:'grid' }; }
})();
function saveListFilter(){ try{ localStorage.setItem(LIST_FILTER_KEY, JSON.stringify(listFilter)); }catch(e){} }
let _listFilterDebounce = null;
function setListFilter(patch){
  Object.assign(listFilter, patch);
  saveListFilter();
  // Debounce render quando a busca está sendo digitada para não perder foco
  if(patch.search !== undefined){
    clearTimeout(_listFilterDebounce);
    _listFilterDebounce = setTimeout(() => {
      render();
      // Restaura foco e posição do cursor no input de busca
      const inp = document.querySelector('input[type="search"]');
      if(inp){
        inp.focus();
        const len = inp.value.length;
        try { inp.setSelectionRange(len, len); } catch(e){}
      }
    }, 180);
  } else {
    render();
  }
}
function searchableTextForShipment(s){
  const parts = [];
  parts.push(s.code||'', s.name||'', s.account||'');
  if(s.account && SHOPEE_ACCOUNTS[s.account]) parts.push(SHOPEE_ACCOUNTS[s.account].label);
  parts.push(s.date||'', fmtDate(s.date)||'', fmtDate(s.createdAt)||'', fmtDate(s.sentAt)||'');
  for(const nf of (s.notes||[])){
    parts.push(nf.nNF||'', nf.serie||'', nf.emitNome||'', nf.chave||'', nf.filename||'');
    for(const it of (nf.items||[])){
      parts.push(it.ean||'', it.cProd||'', it.xProd||'');
    }
  }
  for(const ho of (s.hubOrders||[])){
    parts.push(ho.pedidoNum||'', ho.filename||'');
    for(const it of (ho.items||[])){
      parts.push(it.ean||'', it.cProd||'');
    }
  }
  return parts.join(' \u00b7 ').toLowerCase();
}
function filterAndSortShipments(shipments){
  let arr = shipments.slice();
  const q = (listFilter.search||'').trim().toLowerCase();
  if(q){ arr = arr.filter(s => searchableTextForShipment(s).includes(q)); }
  if(listFilter.status === 'sent') arr = arr.filter(s => s.sent && !s.cancelled);
  else if(listFilter.status === 'pending') arr = arr.filter(s => !s.sent && !s.cancelled);
  else if(listFilter.status === 'cancelled') arr = arr.filter(s => !!s.cancelled);
  if(listFilter.account && listFilter.account !== 'all') arr = arr.filter(s => s.account === listFilter.account);
  const [field, dir] = (listFilter.sortBy||'createdAt-desc').split('-');
  const mul = dir === 'asc' ? 1 : -1;
  arr.sort((a, b) => {
    let av, bv;
    const itemsCount = sh => (sh.notes||[]).reduce((n,nf)=>n+(nf.items?nf.items.length:0),0) + (sh.hubOrders||[]).reduce((n,h)=>n+(h.items?h.items.length:0),0);
    switch(field){
      case 'createdAt': av=a.createdAt||''; bv=b.createdAt||''; break;
      case 'date':      av=a.date||'';      bv=b.date||'';      break;
      case 'sentAt':    av=a.sentAt||'';    bv=b.sentAt||'';    break;
      case 'name':      av=(a.name||'').toLowerCase(); bv=(b.name||'').toLowerCase(); break;
      case 'code':      av=(a.code||'').toLowerCase(); bv=(b.code||'').toLowerCase(); break;
      case 'account':   av=a.account||'';   bv=b.account||'';   break;
      case 'items':     av=itemsCount(a);   bv=itemsCount(b);   break;
      default:          av=a.createdAt||''; bv=b.createdAt||'';
    }
    if(av < bv) return -1*mul;
    if(av > bv) return 1*mul;
    return 0;
  });
  return arr;
}

                ${s.account ? `<div class="acct-badge ${s.account}"><img src="${SHOPEE_ACCOUNTS[s.account].logo}" alt=""/>${SHOPEE_ACCOUNTS[s.account].label}</div>` : '<div class="acct-pill-empty">sem conta</div>'}
              </div>
              <div class="meta" style="margin-top:4px">
                ${s.cancelled
                  ? `<span style="color:#ef4444;font-weight:700">✕ Não enviado</span>${s.date ? ` <span class="small" style="color:var(--muted)">(planejado ${fmtDate(s.date)})</span>` : ''}`
                  : (s.sent && s.sentAt
                    ? `<span style="color:#2ecc71;font-weight:700">✓ Enviado em ${fmtDate(s.sentAt)}</span>${s.date && s.date!==s.sentAt.slice(0,10) ? ` <span class="small" style="color:var(--muted)">(planejado ${fmtDate(s.date)})</span>` : ''}`
                    : (s.date ? `📅 Data do envio: <strong>${fmtDate(s.date)}</strong>` : 'Sem data definida'))}
                <span class="small" style="color:var(--muted)"> · criado em ${fmtDate(s.createdAt)}</span>
              </div>
              <div class="stat">
                <span class="pill">📄 ${s.notes.length} nota${s.notes.length===1?'':'s'}</span>
                <span class="pill ${matched?'ok':''}" ${(s.statOverrides&&s.statOverrides.items!=null)?'title="Editado manualmente · original: '+matched+'"':''}>${(s.statOverrides&&s.statOverrides.items!=null)?s.statOverrides.items:matched} item${((s.statOverrides&&s.statOverrides.items!=null)?s.statOverrides.items:matched)===1?'':'s'}${(s.statOverrides&&s.statOverrides.items!=null)?' ✎':''}</span>
                <span class="pill" ${(s.statOverrides&&s.statOverrides.volumes!=null)?'title="Editado manualmente · original: '+agg.totalVolumes+'"':''}>${(s.statOverrides&&s.statOverrides.volumes!=null)?s.statOverrides.volumes:agg.totalVolumes} vol.${(s.statOverrides&&s.statOverrides.volumes!=null)?' ✎':''}</span>
                ${un? `<span class="pill err">${un} sem match</span>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `)}
  `;
}

function renderAccountSelector(s){
  const acctIds = ['moda','sports'];
  return `
    <div class="row" style="justify-content:space-between;gap:14px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
      <div>
        <div class="small" style="text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--muted);margin-bottom:8px">Conta Shopee deste envio</div>
        <div class="acct-row">
          ${acctIds.map(id => {
            const a = SHOPEE_ACCOUNTS[id];
            const sel = s.account === id ? 'selected ' + id : '';
            return `<div class="acct ${sel}" onclick="setShipmentAccount('${s.id}','${id}')">
              <img src="${a.logo}" alt="${a.label}" />
              <div class="acct-label"><span class="lbl-top">Conta</span><span class="lbl-name">${a.label}</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}
function setShipmentAccount(shipmentId, acct){
  const sh = getShipment(shipmentId); if(!sh) return;
  sh.account = (sh.account === acct) ? '' : acct;
  saveState();
  render();
}

            </div>

        return `

            </div>

          <table class="t">
            <thead><tr>
              <th></th><th>Produto</th><th>Variação</th><th>SKU</th><th>EAN</th><th class="right">Previsto</th><th class="right">Enviado</th><th class="right">Diferença</th><th>Status</th>
            </tr></thead>
            <tbody>
              ${rows.filter(({expected, sent}) => {
                if(_sentConfFilter === 'all') return true;
                if(_sentConfFilter === 'extra') return false;
                const isMiss = sent === 0 && expected > 0;
                const isOk = sent === expected && expected > 0;
                const isDiv = !isOk && !isMiss;
                if(_sentConfFilter === 'ok') return isOk;
                if(_sentConfFilter === 'miss') return isMiss;
                if(_sentConfFilter === 'div') return isDiv;
                return true;
              }).map(({g, it, expected, sent, diff}) => {
                let status, color;
                if(sent === expected && expected>0){ status='✓ OK'; color='#2ecc71'; }
                else if(sent === 0 && expected>0){ status='✗ Não enviado'; color='#ef4444'; }
                else if(diff > 0){ status='⚠ Enviado a mais'; color='#f59e0b'; }
                else { status='⚠ Enviado a menos'; color='#f59e0b'; }
                const bg = (sent === expected && expected>0) ? '' : (sent===0 ? 'background:rgba(239,68,68,.07)' : 'background:rgba(245,158,11,.07)');
                return `<tr style="${bg}">
                  <td style="width:48px">${g.productImage ? `<img src="${escapeHtml(g.productImage)}" alt="" loading="lazy" style="width:36px;height:36px;object-fit:cover;border-radius:6px" onerror="this.style.display='none'"/>` : ''}</td>
                  <td style="max-width:280px"><div class="mono small" style="color:var(--muted);font-size:10.5px">${escapeHtml(g.productId||'')}</div>${escapeHtml(g.productName||'—')}</td>
                  <td>${escapeHtml(it.variationName||'—')}</td>
                  <td class="mono">${escapeHtml(it.sku||'')}</td>
                  <td class="mono">${escapeHtml(it.ean||'')}</td>
                  <td class="num" style="font-weight:700">${expected}</td>
                  <td class="num" style="font-weight:700">${sent}</td>
                  <td class="num" style="font-weight:800;color:${diff===0?'var(--muted)':(diff>0?'#f59e0b':'#ef4444')}">${diff>0?'+':''}${diff}</td>
                  <td style="color:${color};font-weight:700;font-size:11.5px;white-space:nowrap">${status}</td>
                </tr>`;
              }).join('')}
              ${extras.length && (_sentConfFilter === 'all' || _sentConfFilter === 'extra') ? extras.map(it => `
                <tr style="background:rgba(168,85,247,.07)">
                  <td></td>
                  <td colspan="2" style="color:#a855f7;font-weight:700">Item não previsto no envio</td>
                  <td class="mono">${escapeHtml(it.cProd||'')}</td>
                  <td class="mono">${escapeHtml(it.ean||'')}</td>
                  <td class="num" style="color:var(--muted)">—</td>
                  <td class="num" style="font-weight:700">${it.qty}</td>
                  <td class="num" style="font-weight:800;color:#a855f7">+${it.qty}</td>
                  <td style="color:#a855f7;font-weight:700;font-size:11.5px;white-space:nowrap">+ Extra</td>
                </tr>
              `).join('') : ''}
            </tbody>
          </table>
        </div>
      </div>
    `;})() : ''}

    ${unmatched.length ? `
      <div class="panel">
        <h2 style="color:#c2483f">Itens Sem Match no Catálogo <span class="count">${unmatched.length}</span></h2>
        <div class="warn-box">Estes EANs vieram nas notas mas não foram encontrados no catálogo. Eles <strong>não entram</strong> na planilha de aprovação. Verifique o cadastro do produto ou o mapeamento da coluna EAN.</div>
        <div class="scroll">
          <table class="t">
            <thead><tr><th>EAN</th><th>Descrição NF</th><th class="right">Qtd</th><th class="right">Ação</th></tr></thead>
            <tbody>
              ${unmatched.map(t => `
                <tr>
                  <td class="mono unmatched">${escapeHtml(t.ean||'')}</td>
                  <td>${escapeHtml(t.xProd||'')}</td>
                  <td class="num">${t.qty}</td>
                  <td class="right"><button class="btn sm success" style="padding:4px 9px;font-size:11px" onclick="openManualEntryModal('${s.id}','${escapeHtml(t.ean||'')}','${escapeHtml(t.xProd||'')}')">+ Cadastrar</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `:''}
  `;
}
function updateHeaderTitle(){ /* live update if needed */ }
function setCustomQty(shipmentId, key, value, originalQty){
  const s = getShipment(shipmentId); if(!s) return;
  if(!s.customQty) s.customQty = {};
  const num = Number(value);
  if(isNaN(num) || String(num) === '' || num === originalQty){
    delete s.customQty[key];
  }else{
    s.customQty[key] = num;
  }
  saveState();
}

/* ---------- Drag & drop on detail view (NF, Hub e Conferência de Envio Real) ---------- */
function _hitDropzone(target){
  const dzNote = document.getElementById('dz');
  const dzHub = document.getElementById('dzHub');
  const dzSent = document.getElementById('dzSentActual');
  if(dzHub && (target===dzHub || dzHub.contains(target))) return { el: dzHub, kind:'hub' };
  if(dzSent && (target===dzSent || dzSent.contains(target))) return { el: dzSent, kind:'sent' };
  if(dzNote && (target===dzNote || dzNote.contains(target))) return { el: dzNote, kind:'nf' };
  return null;
}
document.addEventListener('dragover', e => {
  const hit = _hitDropzone(e.target);
  if(!hit) return;
  e.preventDefault(); hit.el.classList.add('drag');
});
document.addEventListener('dragleave', e => {
  const dzNote = document.getElementById('dz');
  const dzHub = document.getElementById('dzHub');
  const dzSent = document.getElementById('dzSentActual');
  if(dzNote) dzNote.classList.remove('drag');
  if(dzHub) dzHub.classList.remove('drag');
  if(dzSent) dzSent.classList.remove('drag');
});
document.addEventListener('drop', e => {
  const hit = _hitDropzone(e.target);
  if(!hit) return;
  e.preventDefault(); hit.el.classList.remove('drag');
  if(route.view !== 'detail' || !route.shipmentId) return;
  const files = Array.from(e.dataTransfer.files);
  if(hit.kind === 'hub'){
    const xlsx = files.filter(f => /\.xlsx?$/i.test(f.name));
    if(xlsx.length) handleHubFiles(route.shipmentId, xlsx);
    else toast('Solte arquivos .xlsx ou .xls', 'warn');
  } else if(hit.kind === 'sent'){
    const xlsx = files.filter(f => /\.xlsx?$/i.test(f.name));
    if(xlsx.length) handleSentActualFile(route.shipmentId, xlsx);
    else toast('Solte arquivos .xlsx ou .xls', 'warn');
  } else {
    const invoices = files.filter(f => /\.(xml|pdf|zip)$/i.test(f.name));
    if(invoices.length) handleInvoiceFiles(route.shipmentId, invoices);
    else toast('Solte arquivos .xml, .pdf ou .zip', 'warn');
  }
});

/* ---------- Init / bootstrap ---------- */
(async () => {
  try{
    const raw = localStorage.getItem(CATALOG_KEY);
    if(raw){
      try{
        const c = JSON.parse(raw);
        await saveCatalog('sports', c);
      }catch(e){}
      localStorage.removeItem(CATALOG_KEY);
    }
  }catch(e){}
  render();
  _checkVersionDisplay();
  try{
    await Promise.all([ loadStateAsync(), loadAllCatalogsAsync(), loadAllFbsAsync(), loadAllProductImagesAsync(), loadAllFbsSupplementsAsync() ]);
    if(typeof enrichAllCatalogs === 'function') enrichAllCatalogs();
    if(typeof cleanupNegativeImageCache === 'function'){
      const cleaned = cleanupNegativeImageCache();
      if(cleaned > 0) console.log('[init] Cache negativo de imagens limpo: '+cleaned+' entradas');
    }
    render();
  }catch(e){ console.warn('Load error', e); }
})();
