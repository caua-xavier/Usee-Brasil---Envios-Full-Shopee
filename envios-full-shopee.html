<style>
  :root{
    /* Usee Brasil design tokens — ver Docs/Estilizacao.md */
    --brand-blue:#004edf;
    --brand-blue-deep:#002964;
    --brand-blue-light:#0e60e6;
    --brand-blue-vivid:#0044ef;
    --accent-yellow:#f1c40f;
    --cta-green:#2ecc71;

    /* Semantic mapping mantendo os nomes existentes */
    --bg:#FFFFFF;
    --bg2:#F4F4F4;
    --panel:#FFFFFF;
    --panel2:#F4F4F4;
    --line:#e2e2e2;
    --line-soft:#eeeeee;
    --txt:#333333;
    --txt-strong:#262727;
    --muted:#7a7a7a;
    --muted-2:#555555;
    --accent:#004edf;          /* USEE azul marca */
    --accent-d:#002964;
    --accent-glow:rgba(0,78,223,.18);
    --accent2:#f1c40f;         /* amarelo de destaque */
    --accent2-d:#c9a30b;
    --ok:#4bb98c;
    --warn:#dc8f38;
    --err:#dd7774;
    --info:#3d9ccc;
    --soft:#eeeeee;
  }
  /* Tema escuro — mantém a identidade Usee, ajusta contraste */
  :root[data-theme="dark"]{
    --bg:#0f0f10;
    --bg2:#17181a;
    --panel:#17181a;
    --panel2:#1f2023;
    --line:#2a2b2f;
    --line-soft:#232428;
    --txt:#f2f3f5;
    --txt-strong:#ffffff;
    --muted:#8a8a8a;
    --muted-2:#b5b5b5;
    --accent:#4d8dff;          /* azul Usee clareado para contraste em fundo escuro */
    --accent-d:#004edf;
    --accent-glow:rgba(77,141,255,.22);
    --accent2:#f1c40f;
    --accent2-d:#c9a30b;
    --ok:#4bb98c;
    --warn:#dc8f38;
    --err:#dd7774;
    --info:#3d9ccc;
    --soft:#1a1b1e;
  }
  :root[data-theme="dark"] body{background:radial-gradient(ellipse 80vw 60vh at 20% 15%, rgba(77,141,255,.06), transparent 60%),radial-gradient(ellipse 90vw 70vh at 80% 85%, rgba(241,196,15,.04), transparent 65%),#0f0f10}
  :root[data-theme="dark"] .brand .mark{background:var(--panel);box-shadow:0 0 0 1px var(--line-soft),0 6px 16px rgba(77,141,255,.18)}
  :root[data-theme="dark"] table.t th{background:var(--panel2);border-bottom-color:var(--line)}
  :root[data-theme="dark"] .toast{box-shadow:0 12px 32px rgba(0,0,0,.5)}
  /* Botões com fundo colorido usam texto branco em ambos os temas — nada a sobrescrever aqui */
  :root[data-theme="dark"] .btn.secondary,:root[data-theme="dark"] .btn.ghost,:root[data-theme="dark"] .btn.danger{color:var(--txt)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:'Poppins','Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased}
  html{min-height:100vh}
  body{min-height:100vh;background:#FFFFFF;background-attachment:fixed}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent2)}
  *,*::before,*::after{font-family:'Poppins','Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif !important}
  .app{max-width:1280px;margin:0 auto;padding:18px 22px 80px}

  /* ===== Brand header ===== */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 26px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap;position:relative}
  header.top::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent 0%,#004edf 25%,#004edf 40%,#ec4c2c 60%,#ec4c2c 75%,transparent 100%);opacity:.85}
  .brand{display:flex;align-items:center;gap:18px}
  .brand-logos{display:flex;align-items:center;gap:10px;position:relative}
  .brand-logos::after{content:'';position:absolute;inset:-8px;background:radial-gradient(circle at center,rgba(0,78,223,.08),transparent 60%);pointer-events:none;border-radius:24px;z-index:-1}
  .brand .mark{width:62px;height:62px;border-radius:8px;background:#fff;display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 0 0 1px var(--line-soft),0 6px 16px rgba(0,78,223,.15);overflow:hidden;transition:transform .2s}
  .brand .mark:hover{transform:translateY(-2px) scale(1.03)}
  .brand .mark > svg,.brand .mark > img{width:100%;height:100%;display:block;object-fit:cover;border-radius:15px}
  .brand .mark-shopee{background:#fff;box-shadow:0 0 0 1px var(--line-soft),0 10px 28px rgba(238,77,45,.35)}
  .brand .mark-shopee > img{width:100%;height:100%;display:block;object-fit:contain !important;padding:1px;background:#fff;border-radius:15px;box-sizing:border-box;transform:scale(1.12);transform-origin:center}
  .brand .logos-x{font-size:20px;color:var(--muted);font-weight:300;user-select:none;font-family:'Poppins','Open Sans',sans-serif;opacity:.6}
  .brand .word{display:flex;flex-direction:column;line-height:1.1;gap:5px}
  .brand .word .kicker{font-family:'Poppins','Open Sans',sans-serif;font-weight:800;letter-spacing:.22em;font-size:10.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .brand .word .kicker .k-usee{color:var(--accent)}
  .brand .word .kicker .k-x{color:var(--muted);font-weight:400}
  .brand .word .kicker .k-shop{color:#ee4d2d}
  .brand .word .title{font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--txt);display:flex;align-items:center;gap:10px;margin:0}
  .brand .word .title-grad{background:#ec4c2c;color:#ffffff !important;padding:3px 10px;border-radius:8px;font-weight:800;display:inline-block;line-height:1.15;letter-spacing:.3px;font-size:.72em;box-shadow:0 4px 12px rgba(236,76,44,.3);align-self:center}
  .brand .word .sub{color:var(--muted);font-size:12.5px;margin-top:2px;font-weight:400;letter-spacing:.1px}
  .brand .tag{background:var(--accent);color:#fff;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;vertical-align:middle;line-height:1.4}

  /* ===== Buttons ===== */
  .btn{background:#ffffff;color:#000000;border:1px solid var(--line);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:transform .12s ease, box-shadow .15s ease, filter .15s;letter-spacing:.1px}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,78,223,.18);border-color:var(--accent)}
  .btn:active{transform:translateY(0)}
  .btn.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn.secondary:hover{border-color:var(--accent);box-shadow:none;filter:none}
  .btn.ghost{background:transparent;color:var(--muted-2);border:1px solid var(--line);font-weight:600}
  .btn.ghost:hover{color:var(--txt);border-color:var(--accent);box-shadow:none;filter:none}
  .btn.danger{background:transparent;color:#c2483f;border:1px solid #f0c9c7;font-weight:600}
  .btn.danger:hover{background:#fbeaea;border-color:#dd7774;box-shadow:none;filter:none}
  .btn.success{background:#2ecc71;color:#fff;font-weight:800}
  .btn.success:hover{box-shadow:0 6px 18px rgba(46,204,113,.28)}
  .btn.shopee{background:#ec4c2c;color:#fff !important;font-weight:800;border:0;box-shadow:0 4px 12px rgba(236,76,44,.3)}
  .btn.shopee:hover{box-shadow:0 6px 18px rgba(236,76,44,.35);border:0}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}

  /* ===== Layout primitives ===== */
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,transform .12s, box-shadow .15s;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:0;transition:opacity .2s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,78,223,.08)}
  .card:hover::before{opacity:1}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:700}
  .card .meta{color:var(--muted);font-size:12px}
  .card .stat{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .pill{background:var(--soft);border:1px solid var(--line);color:var(--muted-2);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500}
  .pill.ok{border-color:rgba(46,204,113,.35);color:#1f7a4d;background:rgba(46,204,113,.06)}
  .pill.warn{border-color:rgba(220,143,56,.35);color:#8a5a1f;background:rgba(220,143,56,.06)}
  .pill.err{border-color:rgba(221,119,116,.35);color:#8a2c29;background:rgba(221,119,116,.06)}
  .empty{padding:48px 18px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:6px}

  /* ===== Fields ===== */
  .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .field input,.field select,.field textarea{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;width:100%;transition:border-color .15s, box-shadow .15s}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}

  /* ===== Panels ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .panel h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--txt)}
  .panel h2 .count{background:var(--soft);color:var(--muted);padding:2px 9px;border-radius:999px;font-size:11px;border:1px solid var(--line);font-weight:600}

  /* ===== Tables ===== */
  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t th,table.t td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  table.t th{color:var(--txt-strong);text-transform:uppercase;font-size:10.5px;letter-spacing:.7px;background:#F4F4F4;position:sticky;top:0;font-weight:700;border-bottom:1px solid var(--line)}
  table.t tr:hover td{background:rgba(0,78,223,.03)}
  table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.t th.right,table.t td.right{text-align:right}
  table.t td.center{text-align:center}
  .scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}

  /* ===== Dropzone ===== */
  .dropzone{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);background:var(--panel2);cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:170px;height:100%}
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(0,78,223,.04);color:var(--txt)}
  /* Painel aceita arrastar-soltar planilhas em massa quando já tem planilhas importadas */
  .panel.drag{outline:2px dashed var(--accent);outline-offset:-4px;background:rgba(30,212,224,.04)}
  .dropzone strong{color:var(--accent)}
  .dz-panel{display:flex;flex-direction:column}
  .dz-panel > .dropzone{flex:1}

  /* ===== Misc ===== */
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent}
  .tab.active{color:var(--accent);border-color:var(--accent)}
  .crumb{color:var(--muted);font-size:12px;margin-bottom:10px}
  .crumb a,.crumb a:hover,.crumb a:visited,.crumb a:active,.crumb a:focus{color:var(--txt-strong) !important;cursor:pointer;font-weight:600;text-decoration:none}
  .crumb a:hover{text-decoration:underline}
  .crumb a:hover{color:var(--accent2)}

  #toastWrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column-reverse;gap:8px;z-index:1000;pointer-events:none;align-items:flex-end}
  .toast{position:static;background:var(--panel);border:1px solid var(--line);padding:11px 15px;border-radius:8px;max-width:360px;font-size:13px;box-shadow:0 12px 32px rgba(51,51,51,.18);color:var(--txt);pointer-events:auto;animation:toastIn .25s ease-out both}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px) translateX(12px)}to{opacity:1;transform:none}}
  .toast.leaving{animation:toastOut .25s ease-in both}
  @keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(12px)}}
  .toast.ok{border-color:rgba(46,204,113,.4);background:linear-gradient(180deg,rgba(46,204,113,.04),var(--panel2))}
  .toast.err{border-color:rgba(221,119,116,.4);background:linear-gradient(180deg,rgba(221,119,116,.04),var(--panel2))}
  .toast.warn{border-color:rgba(220,143,56,.4);background:linear-gradient(180deg,rgba(220,143,56,.04),var(--panel2))}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .box,.modal .dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:580px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 14px;font-weight:700;font-size:17px}

  .nf-obs{margin-top:8px;padding:7px 9px;background:rgba(0,78,223,.06);border-left:2px solid var(--accent);border-radius:4px;color:#003a9e;font-size:11.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word;max-height:60px;overflow:hidden;position:relative}
  .nf-obs::after{content:'';position:absolute;bottom:0;left:0;right:0;height:14px;background:linear-gradient(180deg,transparent,var(--panel2))}
  .nf-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  .nf-card .info{display:flex;flex-direction:column;gap:2px}
  .nf-card .info .nf-title{font-weight:700}
  .nf-card .info .nf-meta{color:var(--muted);font-size:12px}
  .nf-card .actions{display:flex;gap:6px}

  .badge-source{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .badge-source.xml{color:var(--accent);border-color:rgba(0,78,223,.4);background:rgba(0,78,223,.06)}
  .badge-source.pdf{color:var(--accent2);border-color:rgba(241,196,15,.4);background:rgba(241,196,15,.05)}

  .small{font-size:11.5px;color:var(--muted)}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:13px}
  .kv .k{color:var(--muted)}

  .topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:28px;margin-bottom:22px}
  .topbar h2{font-weight:700;letter-spacing:-.2px}

  .summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .summary-bar .b{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s}
  .summary-bar .b:hover{border-color:var(--accent)}
  .summary-bar .b .v{font-size:22px;font-weight:800;color:var(--txt-strong);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .summary-bar .b .l{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;margin-top:3px;font-weight:600}
  .summary-bar .b{position:relative}
  .stat-edit{position:absolute;top:8px;right:8px;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;opacity:0;transition:opacity .15s,color .15s}
  .summary-bar .b:hover .stat-edit{opacity:1}
  .stat-edit:hover{color:var(--accent);background:rgba(0,78,223,.1)}
  .stat-orig{font-size:10px;color:var(--muted);text-decoration:line-through;margin-top:2px}

  .warn-box{background:rgba(220,143,56,.06);border:1px solid rgba(220,143,56,.3);color:#8a5a1f;padding:11px 14px;border-radius:12px;margin-bottom:10px;font-size:13px}
  /* Menu lateral (3 barrinhas) */
  .side-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:999}
  .side-menu-backdrop.open{opacity:1;pointer-events:auto}
  .side-menu{position:fixed;top:0;left:0;height:100vh;width:340px;max-width:92vw;background:var(--panel);border-right:1px solid var(--line);box-shadow:8px 0 24px rgba(0,0,0,.3);transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,.61,.36,1);z-index:1000;display:flex;flex-direction:column}
  .side-menu.open{transform:translateX(0)}
  .side-menu-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .side-menu-list{display:flex;flex-direction:column;padding:8px 0;overflow:auto;flex:1}
  .side-item{display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:1px;align-items:center;background:transparent;color:var(--txt);border:none;cursor:pointer;padding:11px 16px;text-align:left;font-size:13.5px;font-weight:600;transition:background .12s}
  .side-item .side-ic{grid-row:1 / span 2;display:flex;align-items:center;justify-content:center;color:#ee5b2e}
  .side-item .side-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .side-item > span.side-label{grid-column:2;grid-row:1;color:var(--txt)}
  .side-item .side-hint{grid-column:2;grid-row:2;font-size:11px;font-weight:500;color:var(--muted)}
  .side-item:hover{background:var(--panel2)}
  .side-sep{height:1px;background:rgba(255,255,255,.12);margin:10px 16px}
  :root:not([data-theme="dark"]) .side-sep{background:rgba(0,0,0,.12)}
  .side-section{display:flex;align-items:center;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt);font-weight:800;padding:12px 16px 4px}
  .side-section-logo{width:18px;height:18px;border-radius:4px;display:inline-block;background-size:cover;background-position:center;background-repeat:no-repeat;background-color:var(--panel2)}
  .side-group{display:flex;flex-direction:column}
  .side-sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:var(--panel2)}
  /* Orelhinha de expansão à direita (chevron) nos itens que têm submenu */
  .side-item.has-sub{grid-template-columns:28px 1fr 20px}
  .side-item .side-chevron{grid-column:3;grid-row:1 / span 2;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .22s ease}
  .side-item .side-chevron svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .side-group.open > .side-item .side-chevron{transform:rotate(180deg)}
  .side-sub.open{max-height:260px}
  .side-sub-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--txt);cursor:pointer;padding:9px 16px 9px 48px;font-size:12.5px;font-weight:600;transition:background .12s}
  .side-sub-item svg{width:16px;height:16px;stroke:#ee5b2e;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .side-sub-item:hover{background:var(--panel)}
  .side-sub-item.danger{color:var(--txt)}
  .side-sub-item.danger svg{stroke:#ef4444}
  .side-sub-item.danger:hover{background:rgba(239,68,68,.1)}
  .side-sub-item[disabled]{opacity:.4;pointer-events:none}
  .ok-box{background:rgba(46,204,113,.05);border:1px solid rgba(46,204,113,.3);color:#1f7a4d;padding:11px 14px;border-radius:12px;margin-bottom:10px;font-size:13px}
  .err-box{background:rgba(221,119,116,.05);border:1px solid rgba(221,119,116,.3);color:#8a2c29;padding:11px 14px;border-radius:12px;margin-bottom:10px;font-size:13px}

  hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
  .mono{font-family:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
  .right{text-align:right}
  .center{text-align:center}

  details{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  details summary{cursor:pointer;color:var(--muted-2);font-weight:600}
  details[open] summary{color:var(--accent)}

  .col-map{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center;margin-bottom:8px}
  .col-map .lbl{color:var(--muted-2);font-size:12.5px;font-weight:500}
  .input-inline{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px}
  .input-inline:focus{outline:none;border-color:var(--accent)}

  .qty-edit{width:80px;background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
  .qty-edit:focus{outline:none;border-color:var(--accent);background:rgba(0,78,223,.04)}

  .unmatched{color:#c2483f}
  .matched{color:var(--accent)}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfcfcf;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-d)}
  ::-webkit-scrollbar-track{background:transparent}

  /* Conta Shopee selector */
  .acct-row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .acct{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 8px;cursor:pointer;transition:all .15s;min-width:180px}
  .acct img{width:42px;height:42px;border-radius:10px;object-fit:cover;display:block}
  .acct .acct-label{display:flex;flex-direction:column;line-height:1.15}
  .acct .acct-label .lbl-top{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .acct .acct-label .lbl-name{font-weight:700;font-size:13px;color:var(--txt)}
  .acct:hover{border-color:var(--accent)}
  .acct.selected{border-color:var(--accent);background:rgba(0,78,223,.07);box-shadow:0 0 0 1px var(--accent) inset}
  .acct.selected.moda{border-color:#1656e0;background:rgba(22,86,224,.08);box-shadow:0 0 0 1px #1656e0 inset}
  .acct.selected.sports{border-color:#ee5b2e;background:rgba(238,91,46,.08);box-shadow:0 0 0 1px #ee5b2e inset}
  .acct-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 8px 3px 3px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
  .acct-badge img{width:18px;height:18px;border-radius:50%;object-fit:cover;display:block}
  .acct-badge.moda{border-color:#1656e0;color:#0e60e6}
  .acct-badge.sports{border-color:#ee5b2e;color:#c2411f}
  .acct-pill-empty{font-size:11px;color:var(--muted);padding:2px 8px;border-radius:999px;background:var(--soft);border:1px dashed var(--line)}

  /* Notas grid + tiles */
  .nf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .nf-tile{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .nf-tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,78,223,.1)}
  .nf-tile .nf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .nf-tile .nf-num{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1;margin:10px 0 4px;word-break:break-all}
  .nf-tile .nf-meta{font-size:11px;color:var(--muted)}
  .nf-tile .nf-emit{font-size:11.5px;color:var(--txt-strong);font-weight:600;margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;line-height:1.25}
  .nf-tile .nf-stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
  .nf-tile .nf-remove{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);border:0;color:#fff;width:26px;height:26px;border-radius:6px;cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1;transition:all .15s;opacity:0;z-index:2}
  .nf-tile .nf-stats{align-items:center;flex-wrap:nowrap;min-width:0;gap:4px}
  .nf-tile .nf-stats .pill{white-space:nowrap;flex-shrink:0;font-size:10px;padding:2px 7px}
  .nf-tile .nf-unmatch{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid rgba(221,119,116,.45);background:rgba(221,119,116,.1);color:#c2483f;letter-spacing:.2px;white-space:nowrap;flex-shrink:0}
  .nf-tile:hover .nf-remove{opacity:1}
  .nf-tile .nf-remove:hover{background:rgba(221,119,116,.18);color:#c2483f}
  .nf-check{position:absolute;top:14px;right:16px;background:transparent;border:1.5px solid var(--line);color:transparent;width:22px;height:22px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;line-height:1;padding:0 0 1px 0;transition:all .15s;z-index:2}
  .nf-tile:hover .nf-check{border-color:var(--muted-2)}
  .nf-check:hover{border-color:var(--ok);color:#2ecc71}
  .nf-check.checked{background:#2ecc71;border-color:#2ecc71;color:#ffffff;opacity:1 !important}
  .nf-tile.received{border-color:rgba(46,204,113,.5);background:rgba(46,204,113,.04)}
  .nf-tile.received:hover{border-color:#2ecc71;box-shadow:0 8px 22px rgba(46,204,113,.1)}
  .nf-tile.received::after{content:'CHEGOU';position:absolute;top:17px;right:52px;background:#2ecc71;color:#ffffff;font-size:9px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.5px}

  /* Shipment card — sent state */
  .card{position:relative}
  .ship-check{position:absolute;top:10px;right:10px;background:transparent;border:1.5px solid var(--line);color:transparent;width:28px;height:28px;border-radius:7px;cursor:pointer;display:grid;place-items:center;font-size:15px;font-weight:800;transition:all .15s;z-index:3}
  .card:hover .ship-check{border-color:var(--muted-2)}
  .ship-check:hover{border-color:#2ecc71;color:#2ecc71}
  .ship-check.checked{background:#2ecc71;border-color:#2ecc71;color:#ffffff;opacity:1 !important}
  .card.sent{border-color:rgba(46,204,113,.6);background:linear-gradient(180deg,rgba(46,204,113,.05),var(--panel))}
  .card.sent:hover{border-color:#2ecc71;box-shadow:0 10px 28px rgba(46,204,113,.15)}
  .card.sent::before{background:linear-gradient(180deg,#2ecc71,#28b463) !important;opacity:1 !important}
  .card.sent .sent-badge{display:inline-block;background:#2ecc71;color:#ffffff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.5px;margin-top:6px}

  /* Drawer lateral */
  .drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:950;animation:fadeIn .2s ease}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(1200px,95vw);background:var(--panel);border-left:1px solid var(--line);z-index:951;display:flex;flex-direction:column;animation:slideIn .25s ease;box-shadow:-20px 0 40px rgba(0,0,0,.5)}
  .drawer .drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .drawer .drawer-head .prod-hero{width:190px !important;height:190px !important;min-width:190px !important;min-height:190px !important;max-width:190px !important;max-height:190px !important;flex-shrink:0 !important}
  .drawer .drawer-head .prod-hero > img,.drawer .drawer-head .prod-hero > div{width:190px !important;height:190px !important;min-width:190px !important;min-height:190px !important;max-width:190px !important;max-height:190px !important;object-fit:cover}
  .drawer .drawer-body{flex:1;overflow:auto;padding:18px 22px}
  .drawer .close-x{background:transparent;border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px;display:grid;place-items:center;flex-shrink:0}
  .drawer .close-x:hover{border-color:var(--accent)}
  @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* Copy button */
  .copy-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:5px;line-height:1;opacity:.55;transition:all .15s;vertical-align:middle;display:inline-flex;align-items:center;margin-left:6px}
  .copy-btn svg{display:block}
  .copy-btn:hover{opacity:1;color:var(--accent);background:rgba(0,78,223,.12)}
  .copy-btn.copied{color:var(--ok);opacity:1}
  .copy-btn.shopee-link{text-decoration:none}
  .copy-btn.shopee-link:hover{color:#ec4c2c;background:rgba(236,76,44,.12)}

  /* Product thumbnail */
  .prod-thumb-wrap{width:48px;height:48px;position:relative}
  .prod-thumb-edit{position:absolute;bottom:-2px;right:-2px;background:var(--accent);color:#fff;border:2px solid var(--bg);width:20px;height:20px;border-radius:50%;cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s;font-weight:800;z-index:5}
  .prod-thumb-wrap:hover .prod-thumb-edit{opacity:1}
  .prod-thumb-edit:hover{filter:brightness(1.1);transform:scale(1.1)}
  .prod-thumb-edit svg{width:11px;height:11px;display:block}
  .prod-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;display:block;cursor:zoom-in;border:1px solid var(--line);background:var(--panel2);transition:transform .15s, border-color .15s}
  .prod-thumb:hover{transform:scale(1.05);border-color:var(--accent)}
  .prod-thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;cursor:default}
  .prod-thumb-empty:hover{transform:none;border-color:var(--line)}
  .prod-thumb-loading{background:linear-gradient(90deg,var(--panel2) 25%,#e8e8e8 50%,var(--panel2) 75%);background-size:200% 100%;animation:thumbShimmer 1.5s linear infinite;color:var(--muted)}
  @keyframes thumbShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Lightbox */
  .lightbox-back{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:1100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;padding:30px;cursor:zoom-out}
  .lightbox-content{position:relative;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;gap:10px;align-items:center}
  .lightbox-content img{max-width:100%;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#fff;cursor:default}
  .lightbox-caption{color:var(--txt);font-size:13px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:6px;backdrop-filter:blur(8px)}
  .lightbox-close{position:fixed;top:18px;right:18px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:#fff;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:22px;display:grid;place-items:center}
  .lightbox-close:hover{background:var(--err);border-color:var(--err)}

  /* Export dropdown menu */
  .exp-wrap{position:relative;display:inline-block}
  .exp-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.6);min-width:0;width:max-content;z-index:60;display:none}
  .exp-wrap.open .exp-menu{display:flex;flex-direction:column;gap:6px}
  .exp-menu button{border:0;padding:11px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:700;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .12s, box-shadow .15s, filter .15s;white-space:nowrap}
  .exp-menu button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
  .exp-menu button:disabled{opacity:.45;cursor:not-allowed}
  .exp-menu button .label-sub{display:block;font-size:11px;font-weight:500;margin-top:3px;opacity:.85;white-space:nowrap}
  .exp-menu button[data-kind="apr"]{background:#2ecc71;color:#ffffff}
  .exp-menu button[data-kind="apr"]:hover:not(:disabled){box-shadow:0 6px 18px rgba(46,204,113,.32)}
  .exp-menu button[data-kind="shp"]{background:#ec4c2c;color:#fff}
  .exp-menu button[data-kind="shp"]:hover:not(:disabled){box-shadow:0 6px 18px rgba(236,76,44,.32)}
  .icon-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;width:40px;height:40px}
  .icon-btn:hover{border-color:#dd7774;color:#c2483f;background:rgba(221,119,116,.08)}
  .icon-btn svg{display:block}

  /* List view */
  .ship-list{display:flex;flex-direction:column;gap:6px}
  .ship-row{display:grid;grid-template-columns:36px minmax(240px,340px) 120px 140px 1fr 140px 130px 100px;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
  .ship-row:hover{border-color:var(--txt-strong);background:var(--panel2)}
  .ship-row.sent{border-color:rgba(46,204,113,.5);background:linear-gradient(180deg,rgba(46,204,113,.05),var(--panel))}
  .ship-row.sent:hover{border-color:#2ecc71}
  .ship-row.cancelled{background:var(--panel);border-color:rgba(239,68,68,.25);filter:brightness(.6) saturate(.7)}
  .ship-row.cancelled:hover{border-color:rgba(239,68,68,.5);filter:brightness(.85) saturate(.9)}
  /* Wrappers que isolam a orelhinha do envio */
  .ship-card-wrap,.ship-row-wrap{position:relative;overflow:visible}
  .ship-row-wrap > .ship-row,.ship-card-wrap > .card{position:relative;z-index:2;transition:border-top-left-radius .18s,border-bottom-left-radius .18s}
  /* No hover, zera o arredondamento da borda esquerda do envio para que a orelhinha encoste reto, sem vão nem sobreposição */
  .ship-row-wrap:hover > .ship-row,.ship-card-wrap:hover > .card{border-top-left-radius:0;border-bottom-left-radius:0}
  /* Orelhinha de duplicar — invisível ao repouso; no hover desliza para fora pela esquerda, encostando no envio */
  .dup-ear{position:absolute;top:0;bottom:0;right:100%;width:40px;background:#fff;color:#000;border-radius:10px 0 0 10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateX(24px);transition:opacity .18s linear,transform .28s cubic-bezier(.22,.61,.36,1);pointer-events:none;box-shadow:-3px 2px 8px rgba(0,0,0,.3);z-index:1}
  .dup-ear svg{width:18px;height:18px;display:block}
  .ship-row-wrap:hover .dup-ear,.ship-card-wrap:hover .dup-ear,.dup-ear:hover{opacity:1;transform:translateX(0);pointer-events:auto}
  .dup-ear:hover{background:#eaeaea}
  .ship-row .sr-name{font-weight:700;font-size:14px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ship-row .sr-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .ship-row .sr-cell{font-size:12.5px;color:var(--txt)}
  .ship-row .sr-cell.muted{color:var(--muted)}
  .sr-cell.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .ship-row-head{display:grid;grid-template-columns:36px minmax(240px,340px) 120px 140px 1fr 140px 130px 100px;gap:10px;align-items:center;padding:8px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-strong);font-weight:700;border-bottom:1px solid var(--line);margin-bottom:6px}
  .view-toggle{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .view-toggle button{background:transparent;border:0;color:var(--muted);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;border-radius:7px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
  .view-toggle button:hover{color:var(--txt)}
  .view-toggle button.active{background:#ffffff;color:#000000;font-weight:700}
  .status-toggle{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0;gap:0;height:38px;box-sizing:border-box}
  .status-toggle button{background:transparent;border:0;color:var(--muted);padding:0 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:9px;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;height:100%}
  .status-toggle button:hover{color:var(--txt)}
  .status-toggle button.active.sent{background:#2ecc71;color:#001a0a;font-weight:700}
  .status-toggle button.active.cancelled{background:#ef4444;color:#2a0505;font-weight:700}

  /* Selection */
  ::selection{background:var(--accent);color:#fff}
</style>

<script>
  // Aplica tema salvo antes do render para evitar flash de tema errado
  (function(){
    try{
      var saved = localStorage.getItem('usee-theme');
      if(!saved){
        saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
  function toggleSideSub(key){
    var el = document.getElementById('sideSub_' + key);
    if(!el) return;
    var openNow = el.classList.contains('open');
    // Fecha todos os outros subs e gira todos os chevrons de volta
    document.querySelectorAll('.side-sub.open').forEach(function(e){ e.classList.remove('open'); });
    document.querySelectorAll('.side-group.open').forEach(function(e){ e.classList.remove('open'); });
    if(!openNow){
      el.classList.add('open');
      var g = document.getElementById('sideGroup_' + key);
      if(g) g.classList.add('open');
    }
  }
  function toggleSideMenu(force){
    var m = document.getElementById('sideMenu');
    var b = document.getElementById('sideMenuBackdrop');
    if(!m || !b) return;
    var want = (typeof force === 'boolean') ? force : !m.classList.contains('open');
    if(want){ m.classList.add('open'); b.classList.add('open'); m.setAttribute('aria-hidden','false'); }
    else   { m.classList.remove('open'); b.classList.remove('open'); m.setAttribute('aria-hidden','true'); }
  }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') toggleSideMenu(false); });
  function toggleTheme(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){
      document.documentElement.removeAttribute('data-theme');
      try{ localStorage.setItem('usee-theme','light'); }catch(e){}
    }else{
      document.documentElement.setAttribute('data-theme','dark');
      try{ localStorage.setItem('usee-theme','dark'); }catch(e){}
    }
    updateThemeIcon();
  }
  function updateThemeIcon(){
    var icon = document.getElementById('themeIcon');
    if(!icon) return;
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    // SVG padrão (lua para dark, sol para light)
    icon.innerHTML = isDark
      ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    var btn = document.getElementById('themeToggle');
    if(btn) btn.setAttribute('title', isDark ? 'Mudar para tema claro' : 'Mudar para tema escuro');
  }
  document.addEventListener('DOMContentLoaded', updateThemeIcon);
</script>

/* ---------- IndexedDB wrapper (for large catalogs) ---------- */
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION + 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_CATALOG)) db.createObjectStore(STORE_CATALOG);
      if(!db.objectStoreNames.contains(STORE_FBS)) db.createObjectStore(STORE_FBS);
      if(!db.objectStoreNames.contains(STORE_IMAGES)) db.createObjectStore(STORE_IMAGES);
      if(!db.objectStoreNames.contains(STORE_FBS_SUPP)) db.createObjectStore(STORE_FBS_SUPP);
      if(!db.objectStoreNames.contains(STORE_STATE)) db.createObjectStore(STORE_STATE);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
function idbGet(store, key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => { db.close(); resolve(req.result); };
    req.onerror = () => { db.close(); reject(req.error); };
  }));
}
function idbSet(store, key, value){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value, key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}
function idbDel(store, key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}

/* ---------- Persistence (IndexedDB primária, localStorage best-effort) ---------- */
function loadState(){
  // Bootstrap síncrono. loadStateAsync() no init substitui pelo dado do IDB.
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || { shipments: [] }; }
  catch(e){ return { shipments: [] }; }
}
async function loadStateAsync(){
  try{
    const idbState = await idbGet(STORE_STATE, 'current');
    if(idbState && idbState.shipments){
      state = idbState;
      return true;
    }
    // IDB vazio — se tem coisa no localStorage, migra pra IDB
    if(state && state.shipments && state.shipments.length){
      await idbSet(STORE_STATE, 'current', state);
      console.log('[migration] state localStorage → IndexedDB:', state.shipments.length, 'envios');
      // Uma vez migrado com sucesso, limpa o localStorage para liberar espaço
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    }
    return false;
  }catch(e){
    console.warn('[loadStateAsync] falhou', e);
    return false;
  }
}
let _saveStateInFlight = null;
let _saveStatePending = false;
let _saveStateLastWarn = 0;
function saveState(){
  // Fire-and-forget: escreve no IDB (persistência real) + best-effort LS (compat).
  // Coalesce chamadas rápidas (várias mutações seguidas viram 1 gravação).
  _saveStatePending = true;
  if(_saveStateInFlight) return;
  _saveStateInFlight = (async () => {
    try{
      while(_saveStatePending){
        _saveStatePending = false;
        const snapshot = state;
        try{ await idbSet(STORE_STATE, 'current', snapshot); }
        catch(err){
          console.error('[saveState IDB]', err);
          const now = Date.now();
          if(now - _saveStateLastWarn > 10000){
            _saveStateLastWarn = now;
            toast('Falha ao salvar (IDB): '+err.message+'. Faça backup.','err');
          }
        }
        // LS best-effort: tenta, silencia quota (agora ok porque IDB já salvou).
        try{ localStorage.setItem(STORE_KEY, JSON.stringify(snapshot)); }catch(e){/* IDB é a fonte da verdade agora */}
      }
    } finally { _saveStateInFlight = null; }
  })();
}
async function loadCatalogAsync(account){
  try{ return await idbGet(STORE_CATALOG, account) || null; }catch(e){ return null; }
}
async function loadAllCatalogsAsync(){
  // 1) Migrate legacy 'current' key → 'sports' (user said existing data is Sports)
  try{
    const legacy = await idbGet(STORE_CATALOG, 'current');
    if(legacy){
      const existing = await idbGet(STORE_CATALOG, 'sports');
      if(!existing) await idbSet(STORE_CATALOG, 'sports', legacy);
      await idbDel(STORE_CATALOG, 'current');
    }
  }catch(e){}
  // 2) Migrate ancient localStorage catalog → 'sports'
  try{
    const raw = localStorage.getItem(CATALOG_KEY);
    if(raw){
      const c = JSON.parse(raw);
      const existing = await idbGet(STORE_CATALOG, 'sports');
      if(!existing) await idbSet(STORE_CATALOG, 'sports', c);
      localStorage.removeItem(CATALOG_KEY);
    }
  }catch(e){}
  // 3) Load both
  const [m, sp] = await Promise.all([loadCatalogAsync('moda'), loadCatalogAsync('sports')]);
  catalogs.moda = m; catalogs.sports = sp;
}

  try{ localStorage.removeItem(CATALOG_KEY); }catch(e){}
  try{ await idbSet(STORE_CATALOG, account, c); }
  catch(e){ console.error(e); toast('Falha salvando catálogo: '+e.message,'err'); throw e; }
}
async function removeCatalog(account){
  if(!account) return;
  catalogs[account] = null;
  try{ await idbDel(STORE_CATALOG, account); }catch(e){}
}

async function saveFbsSupplements(account){
  if(!account) return;
  try{ await idbSet(STORE_FBS_SUPP, account, fbsSupplements[account] || {}); }
  catch(e){ toast('Falha salvando supplementos FBS: '+e.message,'err'); throw e; }

function getFbsSupplement(account, variationKey){
  if(!account || !variationKey) return null;
  return (fbsSupplements[account] && fbsSupplements[account][variationKey]) || null;
}
async function setFbsSupplement(account, variationKey, data){
  if(!account || !variationKey) return;
  if(!fbsSupplements[account]) fbsSupplements[account] = {};
  const has = data && (data.shopSkuId || data.warehouseSkuId || data.variationName || data.sku || data.ean);
  if(has){
    fbsSupplements[account][variationKey] = data;
  } else {
    delete fbsSupplements[account][variationKey];
  }
  await saveFbsSupplements(account);
}

async function loadAllFbsAsync(){
  // Migrate legacy 'current' key → 'sports'
  try{
    const legacy = await idbGet(STORE_FBS, 'current');
    if(legacy){
      const existing = await idbGet(STORE_FBS, 'sports');
      if(!existing) await idbSet(STORE_FBS, 'sports', legacy);
      await idbDel(STORE_FBS, 'current');
    }
  }catch(e){}
  const [m, sp] = await Promise.all([loadFbsAsync('moda'), loadFbsAsync('sports')]);
  fbsAll.moda = m; fbsAll.sports = sp;
}

function loadColMap(){
  try{
    const m = JSON.parse(localStorage.getItem(COLMAP_KEY)) || {};
    // migration: old field names -> new
    if(m.parentSku && !m.sku){ m.sku = m.parentSku; }
    if(m.variationSku && !m.sku){ m.sku = m.variationSku; }
    if(m.variationIntegrationNo && !m.varianteIdentificador){ m.varianteIdentificador = m.variationIntegrationNo; }
    delete m.parentSku; delete m.variationSku; delete m.variationIntegrationNo; delete m.variationId;
    return m;
  }catch(e){ return {}; }
}

function colLetter(idx){ let s=''; let i=idx; while(i>=0){ s=String.fromCharCode(65+(i%26))+s; i=Math.floor(i/26)-1; } return s; }
function colIndex(headers, letter){ // 'A' -> 0
  let n = 0; for(const c of letter.toUpperCase()){ n = n*26 + (c.charCodeAt(0)-64); } return n - 1;
}

/* ---------- Utils ---------- */
function uid(){ return 'sh_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function fmtDate(d){
  if(!d) return '';
  // Datas em formato YYYY-MM-DD (do input type=date) precisam ser tratadas como data LOCAL,
  // senão o navegador interpreta como UTC e o fuso de Brasília (UTC-3) volta pro dia anterior
  if(typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)){
    const [y, m, day] = d.slice(0,10).split('-').map(Number);
    const x = new Date(y, (m||1)-1, day||1);
    if(!isNaN(x)) return x.toLocaleDateString('pt-BR');
  }
  const x = (d instanceof Date) ? d : new Date(d);
  if(isNaN(x)) return d;
  return x.toLocaleDateString('pt-BR');
}

  setTimeout(() => {

    setTimeout(() => el.remove(), 260);
  }, 3800);
}

async function copyValue(text, label, btn){
  if(text==null || text==='') return;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(String(text));
    }else{
      const ta = document.createElement('textarea');
      ta.value = String(text); ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
    toast(`Copiado: ${label || text}`, 'ok');
    if(btn){ btn.classList.add('copied'); setTimeout(()=>btn.classList.remove('copied'), 1200); }
  }catch(err){
    console.error(err);
    toast('Falha ao copiar', 'err');
  }
}
function copyBtn(text, label){
  if(text==null || text==='') return '';
  const t = String(text).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const l = String(label||text).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<button class="copy-btn" data-copy="${t}" data-label="${l}" onclick="event.stopPropagation();copyValue(this.dataset.copy,this.dataset.label,this)" title="Copiar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`;
}

function enrichCatalogWithListingUrls(account, cat){
  if(!cat || !account) return false;
  const shopId = SHOPEE_ACCOUNTS[account] && SHOPEE_ACCOUNTS[account].shopId;
  if(!shopId) return false;
  const URL_COL = 'Listing URL';
  if(!cat.headers.includes(URL_COL)) cat.headers.push(URL_COL);
  const pidCol = (colMap && colMap.productId) || cat.headers[0];
  let count = 0;
  for(const row of cat.rows){
    const pid = row[pidCol];
    if(pid){ row[URL_COL] = `https://shopee.com.br/product/${shopId}/${pid}`; count++; }
  }
  return count;
}
function enrichAllCatalogs(){
  for(const k of ACCOUNT_KEYS){
    if(catalogs[k]) enrichCatalogWithListingUrls(k, catalogs[k]);
  }
}
async function exportCatalogXlsx(account){
  const cat = catalogs[account];

}

/* ---------- Image auto-fetch via CORS proxy ---------- */
const CORS_PROXIES = [
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
];
const IMG_CACHE_KEY = 'shopeeFullManager.imgCache.v1';
const IMG_NEG_TTL = 1000*60*60; // 1h (negativas reexpiram rápido)
let imgCache = {};
try { imgCache = JSON.parse(localStorage.getItem(IMG_CACHE_KEY) || '{}'); } catch(e){}
function saveImgCache(){
  try { localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(imgCache)); }
  catch(e){
    // localStorage quota — drop oldest negative entries
    for(const k of Object.keys(imgCache)){
      if(imgCache[k] && imgCache[k].failedAt) delete imgCache[k];
    }
    try { localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(imgCache)); } catch(_){}
  }
}
function imgCacheKey(account, productId){ return `${account||'?'}_${productId}`; }
function cleanupNegativeImageCache(){
  let cleaned = 0;
  for(const k of Object.keys(imgCache)){
    if(imgCache[k] && imgCache[k].failedAt){ delete imgCache[k]; cleaned++; }
  }
  if(cleaned > 0) saveImgCache();
  return cleaned;
}
function getCachedImage(account, productId){
  const e = imgCache[imgCacheKey(account, productId)];
  if(!e) return undefined; // unknown
  if(e.url) return e.url;  // hit
  if(e.failedAt && (Date.now() - e.failedAt < IMG_NEG_TTL)) return null; // negative still valid
  return undefined; // expired negative → retry
}
async function fetchShopeeImage(account, productId){
  const url = shopeeListingUrl(account, productId);
  if(!url) return null;
  for(const buildProxy of CORS_PROXIES){
    try {
      const r = await fetch(buildProxy(url), { method:'GET' });
      if(!r.ok) continue;
      const html = await r.text();
      // Try og:image patterns
      const patterns = [
        /<meta[^>]*property=["']og:image["'][^>]*content=["']([^"']+)["']/i,
        /<meta[^>]*content=["']([^"']+)["'][^>]*property=["']og:image["']/i,
        /<meta[^>]*name=["']twitter:image["'][^>]*content=["']([^"']+)["']/i
      ];
      for(const re of patterns){
        const m = html.match(re);
        if(m && m[1]) return m[1].replace(/&amp;/g,'&');
      }
    } catch(err) {
      // try next proxy
    }
  }
  return null;
}
// Queue/throttle
const _imgQueue = [];
let _imgActive = 0;
const _IMG_MAX_PARALLEL = 3;
const _IMG_GAP_MS = 200;
function queueImageFetch(account, productId, cb){
  _imgQueue.push({ account, productId, cb });
  pumpImgQueue();
}
function pumpImgQueue(){
  while(_imgActive < _IMG_MAX_PARALLEL && _imgQueue.length){
    const job = _imgQueue.shift();
    _imgActive++;
    (async () => {
      let url = null;
      try { url = await fetchShopeeImage(job.account, job.productId); } catch(e){}
      const k = imgCacheKey(job.account, job.productId);
      if(url) imgCache[k] = { url };
      else imgCache[k] = { failedAt: Date.now() };
      saveImgCache();
      if(job.cb) job.cb(url);
      setTimeout(() => { _imgActive--; pumpImgQueue(); }, _IMG_GAP_MS);
    })();
  }
}
function thumbHtml(account, productId, productName){
  if(!productId) return '<div class="prod-thumb prod-thumb-empty">—</div>';
  const safeName = escapeHtml(String(productName||''));
  // Prioridade: imagem importada via HTML do Google Sheets
  const customImg = getCustomImage(account, productId);
  if(customImg){
    return '<img class="prod-thumb" src="' + escapeHtml(customImg) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'" onclick="event.stopPropagation();openImageLightbox(this.src,\'' + safeName + '\')" />';
  }
  const cached = getCachedImage(account, productId);
  if(typeof cached === 'string'){
    return `<img class="prod-thumb" src="${escapeHtml(cached)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\'prod-thumb prod-thumb-empty\' onclick=\'event.stopPropagation();retryThumb(this,\\\'${escapeHtml(account)}\\\',\\\'${escapeHtml(productId)}\\\',\\\'${safeName}\\\')\' title=\'Clique pra tentar de novo\'>↻</div>'" onclick="event.stopPropagation();openImageLightbox(this.src,'${safeName}')" />`;
  }
  if(cached === null){
    // Negative cache — clicável pra forçar nova tentativa
    return `<div class="prod-thumb prod-thumb-empty" title="Imagem não encontrada — clique pra tentar de novo" style="cursor:pointer" onclick="event.stopPropagation();retryThumb(this,'${escapeHtml(account)}','${escapeHtml(productId)}','${safeName}')">↻</div>`;
  }
  if(!account){
    return '<div class="prod-thumb prod-thumb-empty" title="Selecione a conta Shopee do envio para buscar a imagem">?</div>';
  }
  return `<div class="prod-thumb prod-thumb-empty prod-thumb-loading" data-fetch-acct="${escapeHtml(account)}" data-fetch-pid="${escapeHtml(productId)}" data-fetch-name="${safeName}" title="Buscando imagem...">⏳</div>`;
}
function retryThumb(el, account, productId, productName){
  // remove from cache and re-render this thumb as loading
  delete imgCache[imgCacheKey(account, productId)];
  saveImgCache();
  el.outerHTML = `<div class="prod-thumb prod-thumb-empty prod-thumb-loading" data-fetch-acct="${escapeHtml(account)}" data-fetch-pid="${escapeHtml(productId)}" data-fetch-name="${escapeHtml(productName||'')}" title="Buscando imagem...">⏳</div>`;
  setTimeout(scanAndFetchPendingImages, 50);
}
function scanAndFetchPendingImages(){
  const els = document.querySelectorAll('.prod-thumb-loading[data-fetch-pid]');
  els.forEach(el => {
    if(el._queued) return;
    el._queued = true;
    const acct = el.dataset.fetchAcct;
    const pid = el.dataset.fetchPid;
    const name = el.dataset.fetchName;
    queueImageFetch(acct, pid, (url) => {
      const parent = el.parentNode;
      if(!parent) return;
      if(url){
        const img = document.createElement('img');
        img.className = 'prod-thumb';
        img.src = url;
        img.loading = 'lazy';
        img.onerror = function(){ this.parentNode.innerHTML = '<div class="prod-thumb prod-thumb-empty">—</div>'; };
        img.onclick = function(e){ e.stopPropagation(); openImageLightbox(url, name); };
        parent.replaceChild(img, el);
      } else {
        el.classList.remove('prod-thumb-loading');
        el.textContent = '—';
        el.title = 'Imagem não encontrada';
      }
    });
  });
}

function shopeeListingUrl(account, productId){
  if(!productId) return null;
  const a = account ? SHOPEE_ACCOUNTS[account] : null;
  // Preferred: full URL with shopId (works direct, no search)
  if(a && a.shopId) return `https://shopee.com.br/product/${a.shopId}/${productId}`;
  // Fallback: Shopee search by product ID
  return `https://shopee.com.br/search?keyword=${encodeURIComponent(productId)}`;
}

/* ---------- Column mapping ---------- */
// Shopee mass update — fixed column POSITIONS for ALL fields.
// Name-based detection used as fallback if a position is empty/changed.
const COL_SYNONYMS = {
  productId: ['et_title_product_id','product id','id do produto','id produto','product_id','produto id'],
  productName: ['et_title_product_name','product name','nome do produto','nome produto','name','nome','title'],
  varianteIdentificador: ['et_title_variation_id','variation id','id da variação','id variacao','variation_id','id variação','variation no'],
  variationName: ['et_title_variation_name','variation name','nome da variação','nome variacao','variation','variação','variacao','variation name 1','nome da variação 1'],
  sku: ['et_title_variation_sku','variation sku','sku da variação','sku variacao','variation_sku','variant sku','sku variação','parent sku','sku pai','sku do produto','sku principal','product sku','sku produto','parent_sku','sku'],
  ean: ['ps_gtin_code','barcode','código de barras','codigo de barras','gtin','ean','cod barras','cod. barras','sku integration no','sku integration','barcode (sku integration no)'],
  productImage: ['ps_image_path','et_image_path','image','cover image','main image','imagem','foto','picture','image per variation','image url','url da imagem','product image']
};
// Fixed positions for Shopee mass update (defaults applied automatically)
const FIXED_POS = {
  productId: 'A',              // ID do Produto
  productName: 'B',            // Nome do Produto
  varianteIdentificador: 'C',  // Variante Identificador
  variationName: 'D',          // Nome da Variação
  sku: 'F',                    // SKU
  ean: 'H'                     // GTIN/EAN
};
function autoDetectMap(headers){
  const lower = headers.map(h => String(h||'').toLowerCase().trim());
  const out = {};
  // 1) Fixed positions (Shopee mass update standard)
  for(const [field, letter] of Object.entries(FIXED_POS)){
    const idx = colIndex(headers, letter);
    if(idx >= 0 && idx < headers.length && headers[idx]) out[field] = headers[idx];
  }
  // 2) Name-based fallback for fields without a positional match
  for(const [field, syns] of Object.entries(COL_SYNONYMS)){
    if(out[field]) continue;
    for(const syn of syns){
      const idx = lower.findIndex(h => h === syn || h.includes(syn));
      if(idx >= 0){ out[field] = headers[idx]; break; }
    }
  }
  return out;
}

const MANUAL_KEY = 'shopeeFullManager.manual.v1';
let manualEntries = (function(){
  try{ return JSON.parse(localStorage.getItem(MANUAL_KEY)) || {moda:[], sports:[]}; }
  catch(e){ return {moda:[], sports:[]}; }
})();
if(!manualEntries.moda) manualEntries.moda = [];
if(!manualEntries.sports) manualEntries.sports = [];
function saveManualEntries(){
  try{ localStorage.setItem(MANUAL_KEY, JSON.stringify(manualEntries)); }
  catch(e){ toast('Falha salvando cadastros manuais: '+e.message,'err'); }
}
function getManualEntry(account, key){
  if(!account || !key) return null;
  const list = manualEntries[account] || [];
  const kEan = normEan(key);
  const kHex = String(key).trim().toUpperCase();
  for(const e of list){
    if(kEan && e.ean && normEan(e.ean) === kEan) return e;
    if(kHex && e.varianteIdentificador && String(e.varianteIdentificador).trim().toUpperCase() === kHex) return e;
  }
  return null;
}
function addManualEntry(account, entry){
  if(!manualEntries[account]) manualEntries[account] = [];
  entry.id = 'man_' + uid();
  entry.createdAt = new Date().toISOString();
  manualEntries[account].push(entry);
  saveManualEntries();
  invalidateCatalogIdx(account);
}
function removeManualEntry(account, id){
  manualEntries[account] = (manualEntries[account] || []).filter(e => e.id !== id);
  saveManualEntries();
  invalidateCatalogIdx(account);
}
function manualToFakeRow(manual){
  const m = colMap;
  const row = { __manual: true, __manualId: manual.id };
  if(m.productId) row[m.productId] = manual.productId || '';
  if(m.productName) row[m.productName] = manual.productName || '';
  if(m.varianteIdentificador) row[m.varianteIdentificador] = manual.varianteIdentificador || '';
  if(m.variationName) row[m.variationName] = manual.variationName || '';
  if(m.sku) row[m.sku] = manual.sku || '';
  if(m.ean) row[m.ean] = manual.ean || '';
  if(m.productImage) row[m.productImage] = manual.productImage || '';
  return row;
}

// Cache indexed catalogs by account
const _catalogIdxCache = { moda: null, sports: null };
function indexCatalog(account){
  if(!account) return null;
  if(_catalogIdxCache[account] && _catalogIdxCache[account].__src === catalogs[account]) return _catalogIdxCache[account];
  const cat = getCatalogFor(account);
  if(!cat) return null;
  const map = colMap;
  const eanCol = map.ean;
  const variCol = map.varianteIdentificador;
  const byEan = new Map();
  const byVar = new Map();
  for(const row of cat.rows){
    if(eanCol){
      const raw = row[eanCol];
      if(raw!=null && raw!==''){
        const parts = String(raw).split(/[;,\s\/|]+/).map(normEan).filter(Boolean);
        for(const p of parts){ if(!byEan.has(p)) byEan.set(p, []); byEan.get(p).push(row); }
      }
    }
    if(variCol){
      const v = row[variCol];
      if(v!=null && v!==''){
        const k = String(v).trim().toUpperCase();
        if(k && !byVar.has(k)) byVar.set(k, row);
      }
    }
  }
  const idx = { byEan, byVar, rows: cat.rows, __src: cat };
  _catalogIdxCache[account] = idx;
  return idx;
}
function lookupByEan(account, ean){
  const ix = indexCatalog(account);
  if(!ix) return null;
  const arr = ix.byEan.get(normEan(ean));
  return arr ? arr[0] : null;
}
function lookupByVariante(account, v){
  const ix = indexCatalog(account);
  if(!ix || !v) return null;
  return ix.byVar.get(String(v).trim().toUpperCase()) || null;
}
function lookupCatalog(account, item){
  // 1) Manual entries (cadastros do usuário) têm prioridade
  if(account){
    const manual = (item.ean ? getManualEntry(account, item.ean) : null) || (item.cProd ? getManualEntry(account, item.cProd) : null);
    if(manual) return manualToFakeRow(manual);
  }
  // 2) Catálogo importado
  let r = lookupByEan(account, item.ean);
  if(!r && item.cProd) r = lookupByVariante(account, item.cProd);
  return r;
}
function invalidateCatalogIdx(account){ if(account) _catalogIdxCache[account] = null; else { _catalogIdxCache.moda=null; _catalogIdxCache.sports=null; } }

/* ---------- Catalog loading from xlsx OR zip containing xlsx (multiple) ---------- */
async function handleCatalogFile(file){
  try{
    const ext = file.name.toLowerCase().split('.').pop();
    const sheetFiles = []; // {name, data}
    let displayName = file.name;
    if(ext === 'zip'){
      toast('Descompactando .zip...','');
      const buf = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      const candidates = Object.keys(zip.files).filter(n =>
        !n.startsWith('__MACOSX') &&
        !zip.files[n].dir &&
        /\.(xlsx|xls|csv)$/i.test(n)
      );
      if(!candidates.length){ toast('Nenhum .xlsx/.xls/.csv encontrado dentro do .zip','err'); return; }
      for(const n of candidates){
        const u = await zip.files[n].async('uint8array');
        sheetFiles.push({ name: n.split('/').pop(), data: u });
      }
      displayName = `${file.name} (${candidates.length} planilha${candidates.length===1?'':'s'})`;
    }else if(['xlsx','xls','csv'].includes(ext)){
      const ab = await file.arrayBuffer();
      sheetFiles.push({ name: file.name, data: new Uint8Array(ab) });
    }else{
      toast('Formato não suportado. Use .xlsx, .xls, .csv ou .zip','err'); return;
    }

    // Read ALL files and ALL sheets, unioning rows and headers
    const allHeaders = []; const seenHeaders = new Set();
    const sheets = []; const sheetSources = [];
    let totalSheetsRead = 0;
    for(const sf of sheetFiles){
      let wb;
      try{ wb = XLSX.read(sf.data, { type:'array' }); }
      catch(e){ console.warn('Falha lendo', sf.name, e); continue; }
      for(const sn of wb.SheetNames){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '', raw: false });
        if(!rows.length) continue;
        totalSheetsRead++;
        sheetSources.push(`${sf.name} → ${sn} (${rows.length})`);
        const hdrs = Object.keys(rows[0]);
        for(const h of hdrs){ if(!seenHeaders.has(h)){ seenHeaders.add(h); allHeaders.push(h); } }
        sheets.push({ rows, source: `${sf.name} → ${sn}` });
      }
    }
    if(!sheets.length){ toast('Nenhuma planilha utilizável encontrada', 'err'); return; }

    // Materialize rows with the unioned header set
    const allRows = [];
    for(const s of sheets){
      for(const r of s.rows){
        const out = { __source: s.source };
        for(const h of allHeaders) out[h] = (r[h]!=null ? r[h] : '');
        allRows.push(out);
      }
    }

    const auto = autoDetectMap(allHeaders);
    const merged = Object.assign({}, auto, colMap || {});
    for(const k of Object.keys(merged)){
      if(!allHeaders.includes(merged[k])) delete merged[k];
    }
    for(const k of Object.keys(auto)){
      if(!merged[k]) merged[k] = auto[k];
    }
    try{
      await saveCatalog(modalAccount, {
        filename: displayName,
        sheet: `${totalSheetsRead} aba${totalSheetsRead===1?'':'s'}`,
        sheetSources,
        headers: allHeaders,
        rows: allRows,
        loadedAt: new Date().toISOString()
      });
      invalidateCatalogIdx(modalAccount);
      enrichCatalogWithListingUrls(modalAccount, catalogs[modalAccount]);
    }catch(e){
      // already toasted inside saveCatalog
      return;
    }
    saveColMap(merged);
    toast(`Catálogo ${SHOPEE_ACCOUNTS[modalAccount].label} carregado: ${allRows.length} linhas`, 'ok');
    render();
  }catch(err){
    console.error(err); toast('Erro lendo arquivo: ' + err.message, 'err');
  }
}

/* ---------- NF-e XML parsing ---------- */
function parseXmlNFe(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  const err = xml.querySelector('parsererror');
  if(err) throw new Error('XML inválido');
  // Get nNF
  const nNF = (xml.querySelector('ide > nNF')||xml.getElementsByTagName('nNF')[0])?.textContent?.trim() || '';
  const serie = (xml.querySelector('ide > serie')||xml.getElementsByTagName('serie')[0])?.textContent?.trim() || '';
  const dEmi = (xml.querySelector('ide > dhEmi')||xml.querySelector('ide > dEmi')||xml.getElementsByTagName('dhEmi')[0])?.textContent?.trim() || '';
  const emitNome = xml.querySelector('emit > xNome')?.textContent?.trim() || '';
  const chave = (xml.querySelector('infNFe')?.getAttribute('Id')||'').replace(/^NFe/,'');
  // Items
  const det = xml.querySelectorAll('det');
  const items = [];
  det.forEach(d => {
    const prod = d.querySelector('prod');
    if(!prod) return;
    const cEAN = prod.querySelector('cEAN')?.textContent?.trim() || '';
    const cEANTrib = prod.querySelector('cEANTrib')?.textContent?.trim() || '';
    const cProd = prod.querySelector('cProd')?.textContent?.trim() || '';
    const xProd = prod.querySelector('xProd')?.textContent?.trim() || '';
    const qCom = parseFloat(prod.querySelector('qCom')?.textContent?.trim() || '0');
    const uCom = prod.querySelector('uCom')?.textContent?.trim() || '';
    const ean = (cEAN && cEAN !== 'SEM GTIN') ? cEAN : (cEANTrib && cEANTrib !== 'SEM GTIN' ? cEANTrib : '');
    items.push({ cProd, xProd, ean, qty: qCom, unit: uCom });
  });
  // Volumes
  const vols = xml.querySelectorAll('transp vol');
  let totalVol = 0; const volDetails = [];
  vols.forEach(v => {
    const qVol = parseInt(v.querySelector('qVol')?.textContent || '0', 10) || 0;
    const esp = v.querySelector('esp')?.textContent?.trim() || '';
    totalVol += qVol;
    volDetails.push({ qVol, esp });
  });
  // Observações / Informações Adicionais
  const infCpl = xml.querySelector('infAdic > infCpl')?.textContent?.trim() || xml.getElementsByTagName('infCpl')[0]?.textContent?.trim() || '';
  const infAdFisco = xml.querySelector('infAdic > infAdFisco')?.textContent?.trim() || xml.getElementsByTagName('infAdFisco')[0]?.textContent?.trim() || '';
  return { source:'xml', nNF, serie, dEmi, emitNome, chave, items, volumes: totalVol, volumeDetails: volDetails, infCpl, infAdFisco };
}

/* ---------- PDF DANFE parsing (best-effort) ---------- */
async function parsePdfNFe(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    fullText += tc.items.map(it => it.str).join(' ') + '\n';
  }
  return extractFromDanfeText(fullText);
}
function extractFromDanfeText(text){
  // Number
  const nNF = (text.match(/N[º°o]?\.?\s*([0-9]{1,9})/i)||text.match(/Nota\s*Fiscal[^\d]*([0-9]{3,9})/i)||[])[1] || '';
  const serie = (text.match(/S[ée]rie[:\s]*([0-9]{1,4})/i)||[])[1] || '';
  const chave = (text.match(/(\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4})/)||[])[1]?.replace(/\s+/g,'') || '';
  // Find all GTINs (8/12/13/14 digits) and try to associate qty
  const eanRegex = /(?:^|\s)(\d{8}|\d{12}|\d{13}|\d{14})(?=\s)/g;
  const items = [];
  // Volumes
  let totalVol = 0;
  const volM = text.match(/QUANTIDADE\s+ESP[ÉE]CIE[\s\S]{0,80}?(\d+)\s+(?:CAIXA|CX|VOLUME|PACOTE|PCT|FARDO)/i);
  if(volM) totalVol = parseInt(volM[1],10)||0;
  if(!totalVol){
    const v2 = text.match(/(\d+)\s+(?:CAIXAS?|CXS?|VOLUMES?|PCTS?|FARDOS?)/i);
    if(v2) totalVol = parseInt(v2[1],10)||0;
  }
  // Items: best-effort, group ean + description + qty nearby
  const lines = text.split(/\n+/);
  // Naive scan
  const eanFound = new Set();
  let m;
  while((m = eanRegex.exec(text)) !== null){
    const ean = m[1];
    if(eanFound.has(ean)) continue;
    eanFound.add(ean);
    // try to capture qty within next 80 chars
    const tail = text.slice(m.index, m.index + 220);
    const qm = tail.match(/(?:\s)(\d{1,5}(?:[\.,]\d{1,4})?)\s+(?:UN|PC|CX|PCT|UND|PAR|PAR\.|PR)/i);
    const qty = qm ? parseFloat(qm[1].replace(/\./g,'').replace(',','.')) : null;
    items.push({ cProd:'', xProd:'', ean, qty: qty||0, unit: '', _fromPdf:true });
  }
  return { source:'pdf', nNF, serie, dEmi:'', emitNome:'', chave, items, volumes: totalVol, volumeDetails: totalVol?[{qVol:totalVol,esp:'CAIXA'}]:[], _raw: text };
}

/* ---------- Data válida (Terça/Quinta futuras) ---------- */
function nextValidShipmentDate(){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 1); // hoje não conta
  while(d.getDay() !== 2 && d.getDay() !== 4){
    d.setDate(d.getDate() + 1);
  }
  // Format YYYY-MM-DD in local time
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function validateShipmentDate(shipmentId, value, inputEl){
  const sh = getShipment(shipmentId); if(!sh) return;
  if(!value){
    updateShipment(shipmentId, { date: '' });
    return;
  }
  const d = new Date(value + 'T00:00:00');
  const dow = d.getDay(); // 0=Dom .. 6=Sab
  if(dow !== 1 && dow !== 2 && dow !== 4){
    toast('Apenas Segunda, Terça ou Quinta-feira', 'err');
    if(inputEl) inputEl.value = sh.date || '';
    return;
  }
  updateShipment(shipmentId, { date: value });
}

async function _parseSalesXlsx(arrayBuffer, filename){
  const wb = XLSX.read(new Uint8Array(arrayBuffer), { type:'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  // Processa como matriz; cabeçalho na linha 1, dados a partir da linha 2.
  // Posições fixas conforme Shopee Order Report (apenas o essencial):
  //   B(1)  = Status do pedido  → filtra "Concluído"
  //   G(6)  = Opção de envio    → filtra "Full"
  //   S(18) = Número de referência SKU (SKU do vendedor) → chave do cruzamento com o catálogo
  //   T(19) = Nome da variação (para filtros de variação/tamanho no gráfico)
  //   X(23) = Quantidade
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
  const items = []; // array de { sku, variationName, qty }
  let kept = 0, skippedStatus = 0, skippedFull = 0, skippedNoSku = 0;
  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    if(!row || !row.length) continue;
    const status = String(row[1]||'').trim();
    const shipOpt = String(row[6]||'').trim();
    if(status.toLowerCase() !== 'concluído' && status.toLowerCase() !== 'concluido'){ skippedStatus++; continue; }
    if(shipOpt.toLowerCase() !== 'full'){ skippedFull++; continue; }
    const sku = String(row[18]||'').trim();
    if(!sku){ skippedNoSku++; continue; }
    const variationName = String(row[19]||'').trim();
    const qty = Number(String(row[23]||'').replace(/\./g,'').replace(',','.')) || 0;
    if(qty <= 0) continue;
    items.push({ sku, variationName, qty });
    kept++;
  }
  return { filename, items, stats: { total: rows.length - 1, kept, skippedStatus, skippedFull, skippedNoSku } };
}

async function handleSalesImportFiles(account, files, monthKey){
  if(!files || !files.length) return;
  if(!monthKey || !/^\d{4}-\d{2}$/.test(monthKey)){
    toast('Selecione um mês válido antes de importar','err'); return;
  }
  _salesImportMonth = monthKey;
  const existing = salesReports[account] && salesReports[account][monthKey];
  if(existing){
    if(!confirm(`Já existe um relatório importado para ${monthKey.split('-').reverse().join('/')} ("${existing.filename}").\n\nSubstituir?`)) return;
  }
  toast('Processando arquivos...','', 'ok');
  const allItems = [];
  const filenames = [];
  let totalRows = 0, totalKept = 0;
  for(const file of files){
    const ext = file.name.toLowerCase().split('.').pop();
    try{
      if(ext === 'zip'){
        const buf = await file.arrayBuffer();
        const jszip = await JSZip.loadAsync(buf);
        const xlsxEntries = Object.values(jszip.files).filter(e => !e.dir && /\.xlsx?$/i.test(e.name));
        if(!xlsxEntries.length){ toast(`${file.name}: nenhum .xlsx no zip`,'warn'); continue; }
        for(const entry of xlsxEntries){
          const ab = await entry.async('arraybuffer');
          const r = await _parseSalesXlsx(ab, entry.name);
          allItems.push(...r.items);
          filenames.push(entry.name);
          totalRows += r.stats.total;
          totalKept += r.stats.kept;
        }
      } else if(['xlsx','xls'].includes(ext)){
        const buf = await file.arrayBuffer();
        const r = await _parseSalesXlsx(buf, file.name);
        allItems.push(...r.items);
        filenames.push(file.name);
        totalRows += r.stats.total;
        totalKept += r.stats.kept;
      } else {
        toast(`Formato não suportado: ${file.name}`,'err');
        continue;
      }
    }catch(err){ console.error(err); toast(`Erro em ${file.name}: ${err.message}`,'err'); }
  }
  if(!allItems.length){
    toast('Nenhuma linha "Concluído + Full" encontrada','warn'); return;
  }
  // Agrega por SKU (coluna S), somando a Quantidade (coluna X)
  const bySku = new Map();
  for(const it of allItems){
    const key = String(it.sku).toUpperCase();
    if(!bySku.has(key)){
      bySku.set(key, { sku: it.sku, variationName: it.variationName, qty: 0 });
    }
    bySku.get(key).qty += it.qty;
  }
  if(!salesReports[account]) salesReports[account] = {};
  salesReports[account][monthKey] = {
    filename: filenames.join(', '),
    importedAt: new Date().toISOString(),
    items: Array.from(bySku.values()),
    stats: { totalRows, keptRows: totalKept, uniqueSkus: bySku.size }
  };
  saveSalesReports();
  toast(`${monthKey.split('-').reverse().join('/')}: ${bySku.size} SKUs únicos · ${totalKept} linhas Full/Concluído (de ${totalRows})`,'ok');
  openSalesImportModal();
}

function removeSalesReport(account, monthKey){
  if(!confirm('Remover o relatório de vendas deste mês?')) return;
  if(salesReports[account]) delete salesReports[account][monthKey];
  saveSalesReports();
  openSalesImportModal();
}

function duplicateShipment(id){
  const orig = getShipment(id); if(!orig) return;
  // Clone profundo via JSON — preserva notes, hubOrders, customQty, statOverrides, sentActual, overrides etc.
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = uid();
  copy.name = (orig.name || '(sem nome)') + ' (cópia)';
  copy.createdAt = new Date().toISOString();
  // Zera status de envio — a cópia nasce pendente
  copy.sent = false; copy.sentAt = null;
  copy.cancelled = false; copy.cancelledAt = null;
  // Renova IDs internos para não colidir com os originais
  if(Array.isArray(copy.notes)){
    for(const n of copy.notes){ n.id = 'nf_' + uid(); }
  }
  if(Array.isArray(copy.hubOrders)){
    for(const h of copy.hubOrders){ h.id = 'ho_' + uid(); }
  }
  if(Array.isArray(copy.sentActual)){
    for(const sa of copy.sentActual){ sa.id = 'sa_' + uid(); }
  }
  // Insere logo depois do original na lista
  const idx = state.shipments.findIndex(s => s.id === id);
  if(idx >= 0) state.shipments.splice(idx + 1, 0, copy); else state.shipments.push(copy);
  saveState();
  toast('Envio duplicado','ok');
  route = { view:'detail', shipmentId: copy.id };
  render();
}

/* ---------- Pedido Hub: parse XLSX + handlers ---------- */
function parseHubXlsx(arrayBuffer, filename){
  const wb = XLSX.read(new Uint8Array(arrayBuffer), { type:'array' });
  let bestSheet = wb.SheetNames[0], bestRows = 0;
  for(const sn of wb.SheetNames){
    const j = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval:'', raw:false });
    if(j.length > bestRows){ bestRows = j.length; bestSheet = sn; }
  }
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[bestSheet], { defval:'', raw:false });
  if(!rows.length) throw new Error('Planilha vazia');
  const headers = Object.keys(rows[0]);
  // Por solicitação do usuário, usar APENAS posições fixas: B=Sku(ModelID), C=EAN, G=Qtd
  const colSku = headers[1]; // B
  const colEan = headers[2]; // C
  const colQty = headers[6]; // G

  // Extract pedido number from filename — e.g., produtos_venda_13446733.xlsx
  let pedidoNum = '';
  const m = (filename||'').match(/(\d{4,})/);
  if(m) pedidoNum = m[1];

  const items = [];
  for(const r of rows){
    const qty = parseFloat(String(r[colQty]||'').replace(/\./g,'').replace(',','.')) || 0;
    if(!qty) continue;
    const ean = String(r[colEan]||'').trim();
    const sku = String(r[colSku]||'').trim();
    if(!ean && !sku) continue;
    items.push({
      ean,
      cProd: sku,       // Model ID (hex) — usado como fallback de match no catálogo
      xProd: '',
      qty,
      unit: 'UN'
    });
  }
  return { source:'hub', pedidoNum, items };
}
async function handleHubFiles(shipmentId, files){

    const ext = file.name.toLowerCase().split('.').pop();
    if(!['xlsx','xls'].includes(ext)){ toast(`Formato não suportado: ${file.name}`,'err'); continue; }
    try{
      const buf = await file.arrayBuffer();
      const ho = parseHubXlsx(buf, file.name);
      ho.filename = file.name;
      ho.id = 'hub_' + uid();
      ho.addedAt = new Date().toISOString();
      const s = getShipment(shipmentId); if(!s) return;

    }
  }
  render();
}
